<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexoly11 - Snapchat Camera</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;overflow:hidden}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px;z-index:10}
.top button{background:rgba(0,0,0,.5);color:#fff;border:1px solid #fff;padding:8px 12px;border-radius:20px}
#wrap{position:relative;width:100vw;height:100vh}
video,canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
#canvas{display:none}
.filters{position:fixed;bottom:120px;left:0;right:0;display:flex;gap:8px;overflow-x:auto;padding:10px;z-index:10}
.filters button{flex-shrink:0;padding:10px 16px;border-radius:25px;border:2px solid #fff;background:rgba(0,0,0,.6);color:#fff;font-weight:bold}
.filters button.active{background:#fffc00;color:#000}
.controls{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:20px;z-index:10}
#snap{width:70px;height:70px;border-radius:50%;border:5px solid #fff;background:#fffc00}
.small{width:50px;height:50px;border-radius:50%;background:#333;color:#fff;border:2px solid #fff}
#preview{position:fixed;inset:0;background:#000;display:none;z-index:20;flex-direction:column}
#preview img,#preview video{width:100%;flex:1;object-fit:contain}
.edit{padding:10px;display:flex;gap:8px;overflow-x:auto}
.edit button{background:#222;color:#fff;border:1px solid #555;padding:10px 14px;border-radius:20px}
.music{padding:8px;display:flex;gap:8px;overflow-x:auto}
.music button{background:#fffc00;color:#000;padding:8px 12px;border-radius:20px;border:none;font-weight:bold}
</style>
</head>
<body>

<div id="wrap">
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
</div>

<div class="top">
<button onclick="flip()">🔄 Flip</button>
<button onclick="toggleFlash()">⚡ Flash</button>
<button onclick="toggleBeauty()">✨ AI Beauty: <span id="beautyTxt">OFF</span></button>
</div>

<div class="filters">
<button onclick="setFilter('none',this)" class="active">Original</button>
<button onclick="setFilter('beauty',this)">💛 Beauty</button>
<button onclick="setFilter('bw',this)">🖤 B&W</button>
<button onclick="setFilter('vintage',this)">🤎 Vintage</button>
<button onclick="setFilter('cinematic',this)">🎬 Cinematic</button>
<button onclick="setFilter('pink',this)">� pink</button>
<button onclick="setFilter('sunny',this)">☀️ Sunny</button>
<button onclick="setFilter('cold',this)">❄️ Cold</button>
<button onclick="setFilter('snap',this)">🐶 Snapchat</button>
</div>

<div class="controls">
<button class="small" onclick="openGallery()">🖼️</button>
<button id="snap" onclick="takePhoto()"></button>
