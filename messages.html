<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/style.css"><title>Nexoly11 | Messages</title></head><body><header class="topbar"><a class="brand" href="index.html">NEXOLY<span>11</span> MESSAGES</a></header><main class="wrap"><section class="panel ai-panel"><div class="ai-avatar">✦</div><div><h3>NEXOLY11 AI</h3><p class="muted">App help, creator tips aur account guidance</p></div><button class="btn" id="openAI" type="button">Chat with AI</button><div id="aiChat" class="ai-chat" hidden><div id="aiReplies" class="ai-replies"><p class="bubble theirs">Namaste! Main Nexoly11 AI hoon. App use karne, creator growth aur settings mein madad kar sakta hoon.</p></div><div class="ai-compose"><input class="field" id="aiText" maxlength="500" placeholder="Ask Nexoly11 AI…"><button class="btn" id="sendAI" type="button">Send</button></div></div></section><section class="panel"><h3>Find a user</h3><input class="field" id="userSearch" placeholder="Enter exact username"><button class="btn" id="findUser">Search</button><p id="status" class="status"></p></section><section class="panel"><h3>Inbox</h3><div id="chatList" class="chatlist">Loading…</div></section><section class="panel" id="chatPanel" style="display:none"><h3 id="chatTitle">Chat</h3><div id="chatMessages" style="max-height:45vh;overflow:auto"></div><input class="field" id="messageText" maxlength="2000" placeholder="Message…"><button class="btn full" id="sendMessage">Send</button></section></main><nav class="bottomnav" aria-label="Main navigation"><a href="index.html" aria-label="Home"><span>⌂</span></a><a href="search.html" aria-label="Search"><span>⌕</span></a><a href="reels.html" aria-label="Reels"><span>▶</span></a><a class="create-nav" href="upload.html" aria-label="Create"><span>＋</span></a><a class="active" href="messages.html" aria-label="Messages"><span>✉</span></a><a href="dashboard.html" aria-label="Profile"><span>♙</span></a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/app.js" defer></script><script>document.getElementById('findUser').onclick=async()=>{const name=document.getElementById('userSearch').value.trim().toLowerCase();if(!name)return;const {data,error}=await N11.from('profiles').select('id,username').eq('username',name).maybeSingle();if(error||!data){document.getElementById('status').textContent=error?.message||'User not found';return}const {data:u}=await N11.auth.getUser();if(data.id===u.user.id){document.getElementById('status').textContent='This is your own account.';return}document.getElementById('status').textContent='Found @'+data.username+'. Open the chat from inbox after first message.';document.getElementById('chatPanel').style.display='block';document.getElementById('chatTitle').textContent='@'+data.username;document.getElementById('chatMessages').textContent='Start a conversation';document.getElementById('sendMessage').onclick=async()=>{const body=document.getElementById('messageText').value.trim();if(!body)return;const {error:e}=await N11.from('messages').insert({sender_id:u.user.id,recipient_id:data.id,body});document.getElementById('status').textContent=e?.message||'Message sent';if(!e){document.getElementById('chatMessages').textContent=body;document.getElementById('messageText').value=''}}};</script><script src="js/social-extras.js" defer></script><script src="js/theme.js"></script><script src="js/nexoly-ai.js" defer></script></body></html>
