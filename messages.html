<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/style.css"><title>Nexoly11 | Messages</title>
<style>
/* Premium Nexoly11 Messages UI */
:root{color-scheme:dark;--n11-bg:#080d19;--n11-surface:#111a2b;--n11-border:#263650;--n11-text:#f3f7ff;--n11-muted:#9aabc5;--n11-accent:#35d6c3;--n11-input:#0c1424;--n11-accentText:#06201e}
html,body{background:radial-gradient(ellipse at 50% -10%,#18334a 0%,#0b1221 42%,#080d19 78%)!important;color:#f3f7ff!important;min-height:100%}
body{padding-bottom:88px}.topbar{min-height:68px;padding:16px 20px!important;background:#0a1120ed!important;border-bottom:1px solid #263650!important;box-shadow:0 8px 28px #0003}
.brand{font-size:19px!important;letter-spacing:1.2px!important;color:#f4f8ff!important}.brand span{color:#35d6c3!important}
.wrap{max-width:620px;padding:18px 15px 28px!important}.panel{position:relative;margin:15px 0!important;padding:22px!important;border:1px solid #263650!important;border-radius:22px!important;background:linear-gradient(145deg,#152238 0%,#101a2c 68%,#111b2d 100%)!important;box-shadow:0 14px 34px #0003!important;overflow:hidden}
.panel h3{font-size:21px;letter-spacing:-.35px;margin:4px 0 17px!important;color:#f4f7ff!important}.ai-panel{display:grid;grid-template-columns:48px 1fr;gap:2px 13px;align-items:center;padding:23px!important;border-color:#2c5261!important;background:radial-gradient(circle at 100% 0%,#174451 0%,transparent 48%),linear-gradient(135deg,#14283c,#101a2b 72%)!important}.ai-avatar{grid-row:1/3;width:46px;height:46px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,#35d6c3,#4f8cff);color:#061522!important;font-size:27px!important;box-shadow:0 7px 22px #35d6c333}.ai-panel h3{margin:0 0 5px!important;font-size:19px!important}.ai-panel .muted{margin:0;font-size:13px!important;line-height:1.5}.ai-panel #openAI{grid-column:1/-1;justify-self:start;margin:17px 0 0!important}.btn{border:0!important;border-radius:13px!important;padding:13px 20px!important;background:linear-gradient(135deg,#35d6c3,#58a9ff)!important;color:#061a25!important;font-weight:850!important;box-shadow:0 7px 18px #35d6c326!important}.btn:active{transform:scale(.98)}.field{min-height:54px!important;margin:10px 0 13px!important;padding:15px 17px!important;border:1px solid #30415d!important;border-radius:14px!important;background:#0a1425!important;color:#f4f7ff!important;font-size:16px!important;box-shadow:inset 0 1px 3px #0003}.field::placeholder{color:#8192ad!important}.status{color:#35d6c3!important}.chatlist{min-height:160px;display:grid;place-items:center;text-align:center;color:#9aabc5!important}.chatlist:empty:after{content:'Your conversations will appear here';color:#91a3bd}.chatlist:not(:empty){display:block}.chatlist .row{border-bottom:1px solid #263650!important;padding:15px 5px!important}.ai-chat{border-color:#2c5261!important}.ai-replies{padding:10px 0!important}.bubble{border-radius:17px!important;padding:12px 15px!important;line-height:1.5}.bubble.theirs{background:#1b2b42!important;color:#eaf3ff!important}.bubble.mine{background:#35d6c3!important;color:#06201e!important}.ai-compose{gap:9px}.ai-compose .field{min-width:0}.bottomnav{height:72px!important;background:#0a1120f5!important;border-top:1px solid #263650!important;box-shadow:0 -8px 30px #0003}.bottomnav a{font-size:23px!important;color:#8092ad!important}.bottomnav a.active{color:#35d6c3!important}.bottomnav .create-nav{width:44px;height:44px;display:grid;place-items:center;border-radius:15px;background:#172b3b;color:#35d6c3!important}

@media(max-width:390px){.wrap{padding:13px 11px 25px!important}.panel{padding:18px!important;border-radius:19px!important}.ai-panel{grid-template-columns:42px 1fr;gap:2px 10px}.ai-avatar{width:42px;height:42px}}
</style></head><body><header class="topbar"><a class="brand" href="index.html">NEXOLY<span>11</span> MESSAGES</a></header><main class="wrap"><section class="panel ai-panel"><div class="ai-avatar">✦</div><div><h3>NEXOLY11 AI</h3><p class="muted">App help, creator tips aur account guidance</p></div><button class="btn" id="openAI" type="button">Chat with AI</button><div id="aiChat" class="ai-chat" hidden><div id="aiReplies" class="ai-replies"><p class="bubble theirs">Namaste! Main Nexoly11 AI hoon. App use karne, creator growth aur settings mein madad kar sakta hoon.</p></div><div class="ai-compose"><input class="field" id="aiText" maxlength="500" placeholder="Ask Nexoly11 AI…"><button class="btn" id="sendAI" type="button">Send</button></div></div></section><section class="panel"><h3>Find people</h3><input class="field" id="userSearch" placeholder="Enter exact username"><button class="btn" id="findUser">Search</button><p id="status" class="status"></p></section><section class="panel"><h3>Messages</h3><div id="chatList" class="chatlist">Loading…</div></section><section class="panel" id="chatPanel" style="display:none"><h3 id="chatTitle">Chat</h3><div id="chatMessages" style="max-height:45vh;overflow:auto"></div><input class="field" id="messageText" maxlength="2000" placeholder="Message…"><button class="btn full" id="sendMessage">Send</button></section></main><nav class="bottomnav" aria-label="Main navigation"><a href="index.html" aria-label="Home"><span>⌂</span></a><a href="search.html" aria-label="Search"><span>⌕</span></a><a href="reels.html" aria-label="Reels"><span>▶</span></a><a class="create-nav" href="upload.html" aria-label="Create"><span>＋</span></a><a class="active" href="messages.html" aria-label="Messages"><span>✉</span></a><a href="dashboard.html" aria-label="Profile"><span>♙</span></a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/app.js" defer></script><script>document.getElementById('findUser').onclick=async()=>{const name=document.getElementById('userSearch').value.trim().toLowerCase();if(!name)return;const {data,error}=await N11.from('profiles').select('id,username').eq('username',name).maybeSingle();if(error||!data){document.getElementById('status').textContent=error?.message||'User not found';return}const {data:u}=await N11.auth.getUser();if(data.id===u.user.id){document.getElementById('status').textContent='This is your own account.';return}document.getElementById('status').textContent='Found @'+data.username+'. Open the chat from inbox after first message.';document.getElementById('chatPanel').style.display='block';document.getElementById('chatTitle').textContent='@'+data.username;document.getElementById('chatMessages').textContent='Start a conversation';document.getElementById('sendMessage').onclick=async()=>{const body=document.getElementById('messageText').value.trim();if(!body)return;const {error:e}=await N11.from('messages').insert({sender_id:u.user.id,recipient_id:data.id,body});document.getElementById('status').textContent=e?.message||'Message sent';if(!e){document.getElementById('chatMessages').textContent=body;document.getElementById('messageText').value=''}}};</script><script src="js/social-extras.js" defer></script><script src="js/theme.js"></script><script src="js/nexoly-ai.js" defer></script></body></html>
