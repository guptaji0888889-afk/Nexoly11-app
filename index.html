<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Nexoly11 - Home</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
background:#080808;
color:white;
font-family:Arial,sans-serif;
padding-bottom:75px
}

header{
height:60px;
padding:12px 16px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #252525;
position:sticky;
top:0;
background:#080808;
z-index:10
}

.logo{font-size:23px;font-weight:900}
.icons{display:flex;gap:20px;font-size:24px}

.stories{
display:flex;
gap:15px;
overflow-x:auto;
padding:15px;
border-bottom:1px solid #222
}

.story{
min-width:65px;
text-align:center;
cursor:pointer
}

.ring{
width:62px;
height:62px;
border-radius:50%;
padding:3px;
background:linear-gradient(45deg,#ffb700,#ff0050,#8b00ff)
}

.inner{
width:100%;
height:100%;
border-radius:50%;
background:#222;
border:3px solid black;
display:grid;
place-items:center;
font-size:24px;
overflow:hidden
}

.inner img,.inner video{
width:100%;
height:100%;
object-fit:cover
}

.story small{font-size:11px}

.categories{
display:flex;
overflow-x:auto;
gap:9px;
padding:14px
}

.cat{
white-space:nowrap;
padding:9px 14px;
border-radius:20px;
border:1px solid #333;
background:#171717;
color:white
}

.cat.active{background:white;color:black}

.section{
padding:10px 15px;
font-weight:bold;
font-size:18px
}

.post{
margin:12px;
border:1px solid #292929;
border-radius:12px;
overflow:hidden;
background:#111
}

.user{
display:flex;
align-items:center;
gap:10px;
padding:12px
}

.avatar{
width:38px;
height:38px;
border-radius:50%;
background:linear-gradient(45deg,#ff0050,#7000ff);
display:grid;
place-items:center;
font-weight:bold
}

.username{font-size:14px;font-weight:bold}

.media{
height:300px;
display:grid;
place-items:center;
font-size:65px;
background:linear-gradient(140deg,#202020,#3b164c,#101010)
}

.actions{
display:flex;
gap:20px;
padding:13px;
font-size:23px
}

.actions button{
background:none;
border:none;
color:white;
font-size:22px
}

.caption{padding:0 13px 14px;font-size:14px}

button{cursor:pointer}

nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:62px;
background:#080808;
border-top:1px solid #333;
display:flex;
justify-content:space-around;
align-items:center;
z-index:20
}

nav a{
color:white;
text-decoration:none;
font-size:23px
}

.modal{
display:none;
position:fixed;
inset:0;
background:#000;
z-index:100;
padding:15px;
overflow:auto
}

.modal.show{display:block}

.modal input,.modal textarea{
width:100%;
padding:12px;
margin:8px 0;
background:#191919;
border:1px solid #444;
border-radius:8px;
color:white
}

.btn{
padding:12px 16px;
border:0;
border-radius:8px;
background:white;
color:black;
font-weight:bold;
margin:5px 2px
}

.preview{
position:relative;
width:100%;
height:55vh;
background:#171717;
display:grid;
place-items:center;
overflow:hidden;
border-radius:12px
}

.preview img,.preview video{
width:100%;
height:100%;
object-fit:contain
}

.overlayText{
position:absolute;
top:45%;
left:5%;
width:90%;
text-align:center;
font-size:25px;
font-weight:bold;
text-shadow:2px 2px 5px black;
overflow-wrap:anywhere
}

.viewer{
position:fixed;
inset:0;
background:black;
z-index:200;
display:none;
justify-content:center;
align-items:center
}

.viewer.show{display:flex}

.viewer img,.viewer video{
width:100%;
height:85%;
object-fit:contain
}

.close{
position:absolute;
top:20px;
right:20px;
font-size:30px;
z-index:210;
background:none;
border:0;
color:white
}

.viewerText{
position:absolute;
bottom:12%;
font-size:25px;
text-shadow:2px 2px 5px black;
text-align:center;
width:90%
}

</style>
</head>

<body>

<header>
<div class="logo">NEXOLY11 🇮🇳</div>
<div class="icons">
<span onclick="alert('Notifications')">♡</span>
<span onclick="location.href='messages.html'">✉</span>
</div>
</header>

<!-- STORIES -->

<div class="stories" id="stories">

<div class="story" onclick="openEditor()">
<div class="ring">
<div class="inner">+</div>
</div>
<small>Your Story</small>
</div>

</div>

<!-- CATEGORIES -->

<div class="categories">

<button class="cat active"
onclick="filter(this,'All')">All</button>

<button class="cat"
onclick="filter(this,'Motivation')">Motivation</button>

<button class="cat"
onclick="filter(this,'Business')">Business</button>

<button class="cat"
onclick="filter(this,'Bhakti')">Bhakti</button>

<button class="cat"
onclick="filter(this,'Education')">Education</button>

<button class="cat"
onclick="filter(this,'Bollywood')">Bollywood</button>

<button class="cat"
onclick="filter(this,'Rajniti')">Rajniti</button>

</div>

<div class="section">🏠 Home Feed</div>

<div id="feed">

<div class="post" data-category="Motivation">
<div class="user">
<div class="avatar">N11</div>
<div>
<div class="username">Nexoly11 Official ✓</div>
<small>India 🇮🇳</small>
</div>
</div>

<div class="media">🔥</div>

<div class="actions">
<button onclick="like(this)">♡</button>
<button onclick="comment()">💬</button>
<button onclick="share()">↗</button>
</div>

<div class="caption">
<b>Motivation</b><br>
अपने सपनों के लिए मेहनत करते रहो। 🇮🇳
</div>
</div>

<div class="post" data-category="Business">
<div class="user">
<div class="avatar">N</div>
<div>
<div class="username">India Business</div>
<small>Business Category</small>
</div>
</div>

<div class="media">💼</div>

<div class="actions">
<button onclick="like(this)">♡</button>
<button onclick="comment()">💬</button>
<button onclick="share()">↗</button>
</div>

<div class="caption">
<b>Business</b><br>
अपने विचार साझा करें।
</div>
</div>

<div class="post" data-category="Bhakti">
<div class="user">
<div class="avatar">ॐ</div>
<div>
<div class="username">Bhakti India</div>
<small>Bhakti Category</small>
</div>
</div>

<div class="media">🙏</div>

<div class="actions">
<button onclick="like(this)">♡</button>
<button onclick="comment()">💬</button>
<button onclick="share()">↗</button>
</div>

<div class="caption">
<b>Bhakti</b><br>
जय श्री राम 🙏
</div>
</div>

</div>

<!-- STORY EDITOR -->

<div class="modal" id="editor">

<h2>✨ Create Story</h2>

<input type="file" id="storyFile"
accept="image/*,video/*">

<input type="file" id="musicFile"
accept="audio/*">

<input type="text" id="storyText"
placeholder="Write something...">

<button class="btn" onclick="addEmoji()">❤️ Add Emoji</button>

<div class="preview" id="preview">
<div>Select Photo or Video</div>
</div>

<button class="btn" onclick="previewStory()">Preview</button>

<button class="btn" onclick="publishStory()">Share Story</button>

<button class="btn" onclick="closeEditor()">Cancel</button>

</div>

<!-- STORY VIEWER -->

<div class="viewer" id="viewer">

<button class="close" onclick="closeViewer()">×</button>

<div id="viewerMedia"></div>

<div class="viewerText" id="viewerText"></div>

<div style="position:absolute;bottom:20px">
<button class="btn" onclick="nextStory()">Next Story</button>
</div>

</div>

<!-- NAVIGATION -->

<nav>
<a href="index.html">🏠</a>
<a href="reels.html">🎬</a>
<a href="upload.html">➕</a>
<a href="messages.html">✉</a>
<a href="dashboard.html">👤</a>
</nav>

<script>

let stories=[];
let currentStory=0;
let selectedMedia=null;
let selectedMusic=null;
let previewURL=null;

const fileInput=document.getElementById('storyFile');
const musicInput=document.getElementById('musicFile');

function openEditor(){
document.getElementById('editor').classList.add('show');
}

function closeEditor(){
document.getElementById('editor').classList.remove('show');
}

fileInput.addEventListener('change',function(){

const file=this.files[0];
if(!file)return;

if(file.size>30*1024*1024){
alert('File size 30MB se kam rakhein');
this.value='';
return;
}

selectedMedia=file;

if(previewURL)URL.revokeObjectURL(previewURL);

previewURL=URL.createObjectURL(file);

showPreview(previewURL,file.type);

});

musicInput.addEventListener('change',function(){

selectedMusic=this.files[0]||null;

if(selectedMusic){
alert('Music selected: '+selectedMusic.name);
}

});

function showPreview(url,type){

const preview=document.getElementById('preview');

preview.innerHTML='';

let media;

if(type.startsWith('video/')){
media=document.createElement('video');
media.controls=true;
media.src=url;
}else{
media=document.createElement('img');
media.src=url;
}

preview.appendChild(media);

const text=document.getElementById('storyText').value;

const overlay=document.createElement('div');
overlay.className='overlayText';
overlay.textContent=text;

preview.appendChild(overlay);

}

function previewStory(){

if(!selectedMedia){
alert('Please select a photo or video');
return;
}

showPreview(previewURL,selectedMedia.type);

}

function addEmoji(){

const input=document.getElementById('storyText');
input.value+=' ❤️';

}

document.getElementById('storyText')
.addEventListener('input',function(){

if(selectedMedia){
showPreview(previewURL,selectedMedia.type);
}

});

function publishStory(){

if(!selectedMedia){
alert('Please select a photo or video');
return;
}

const story={

url:previewURL,
type:selectedMedia.type,
text:document.getElementById('storyText').value,
music:selectedMusic?
URL.createObjectURL(selectedMusic):null,
time:Date.now()

};

stories.push(story);

renderStories();

closeEditor();

fileInput.value='';
musicInput.value='';
document.getElementById('storyText').value='';

selectedMedia=null;
selectedMusic=null;
previewURL=null;

alert('Story added successfully!');

}

function renderStories(){

const container=document.getElementById('stories');

container.innerHTML=`
<div class="story" onclick="openEditor()">
<div class="ring">
<div class="inner">+</div>
</div>
<small>Your Story</small>
</div>`;

stories.forEach((story,index)=>{

const item=document.createElement('div');
item.className='story';

const ring=document.createElement('div');
ring.className='ring';

const inner=document.createElement('div');
inner.className='inner';

if(story.type.startsWith('image/')){

const img=document.createElement('img');
img.src=story.url;
inner.appendChild(img);

}else{

inner.textContent='▶';

}

ring.appendChild(inner);

const name=document.createElement('small');
name.textContent='Your Story '+(index+1);

item.appendChild(ring);
item.appendChild(name);

item.onclick=()=>openViewer(index);

container.appendChild(item);

});

}

function openViewer(index){

currentStory=index;

const story=stories[index];

if(!story)return;

const viewer=document.getElementById('viewer');
const media=document.getElementById('viewerMedia');

media.innerHTML='';

let element;

if(story.type.startsWith('video/')){

element=document.createElement('video');
element.src=story.url;
element.controls=true;
element.autoplay=true;

}else{

element=document.createElement('img');
element.src=story.url;

}

media.appendChild(element);

document.getElementById('viewerText').textContent=story.text;

if(story.music){

const audio=document.createElement('audio');
audio.src=story.music;
audio.autoplay=true;
audio.loop=true;
audio.id='storyAudio';

viewer.appendChild(audio);

}

viewer.classList.add('show');

}

function closeViewer(){

const viewer=document.getElementById('viewer');

const audio=document.getElementById('storyAudio');

if(audio){
audio.pause();
audio.remove();
}

const video=viewer.querySelector('video');

if(video)video.pause();

viewer.classList.remove('show');

}

function nextStory(){

closeViewer();

currentStory++;

if(currentStory<stories.length){
openViewer(currentStory);
}else{
alert('No more stories');
}

}

function filter(button,category){

document.querySelectorAll('.cat')
.forEach(b=>b.classList.remove('active'));

button.classList.add('active');

document.querySelectorAll('.post')
.forEach(post=>{

post.style.display=
category==='All'||
post.dataset.category===category
?'block':'none';

});

}

function like(button){

button.textContent=
button.textContent==='♡'?'❤️':'♡';

}

function comment(){

alert('Comment feature backend connection pending');

}

function share(){

if(navigator.share){

navigator.share({
title:'Nexoly11',
text:'Check out Nexoly11!'
});

}else{

alert('Sharing not supported');

}

}

</script>

</body>
</html>
