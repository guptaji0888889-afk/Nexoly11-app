<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
  <title>Nexoly11</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui}
.header{padding:12px 15px;display:flex;justify-content:space-between;border-bottom:1px solid #222}
.logo{font-weight:900;font-size:22px;letter-spacing:1px}
.story-row{display:flex;gap:12px;overflow-x:auto;padding:12px;border-bottom:1px solid #222}
.story-row::-webkit-scrollbar{display:none}
.s{text-align:center;min-width:62px}
.ring{width:62px;height:62px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.inner{width:100%;height:100%;border-radius:50%;border:3px solid #000;background:#222;display:flex;align-items:center;justify-content:center;font-size:24px}
.s span{font-size:10px;display:block;margin-top:4px}
.profile{padding:15px;padding-bottom:70px}
.top{display:flex;gap:20px;align-items:center}
.dp{width:84px;height:84px;border-radius:50%;background:linear-gradient(45deg,#ff0050,#7000ff);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900}
.stats{display:flex;gap:22px;text-align:center}
.stats b{display:block;font-size:18px}
.bio{margin-top:12px;font-size:14px;line-height:1.4}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:9px;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:#fff;font-weight:600;text-decoration:none;text-align:center}
.btn.primary{background:#fff;color:#000}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;margin-top:15px}
.box{aspect-ratio:1;background:#111;display:flex;align-items:center;justify-content:center;font-size:26px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:12px 0}
.nav a{color:#fff;text-decoration:none;font-size:22px}
.wm{position:fixed;top:60px;right:8px;background:rgba(255,255,255,0.12);padding:3px 8px;border-radius:12px;font-size:10px}
</style>
</head>
<body>
<div class="header"><div class="logo">NEXOLY11 🇮🇳</div><div>☾</div></div>

<div class="story-row">
  <div class="s"><div class="ring"><div class="inner">➕</div></div><span>Your Story</span></div>
  <div class="s"><div class="ring"><div class="inner">🔥</div></div><span>Nexoly11</span></div>
  <div class="s"><div class="ring"><div class="inner">🇮🇳</div></div><span>Desi</span></div>
  <div class="s"><div class="ring"><div class="inner">⭐</div></div><span>India</span></div>
  <div class="s"><div class="ring"><div class="inner">💪</div></div><span>GuptaJi</span></div>
</div>

<div class="wm">NEXOLY11 OFFICIAL</div>

<div class="profile">
  <div class="top">
    <div class="dp">N11</div>
    <div class="stats">
      <div><b>11</b>Posts</div>
      <div><b>11K</b>Followers</div>
      <div><b>111</b>Following</div>
    </div>
  </div>
  <div class="bio">
    <b>Nexoly11_Official ✓</b><br>
    India's Own Social App 🇮🇳<br>
    60 Sec Reels • Desi Stories 💪<br>
    👇 Reels Dekho
  </div>
  <div class="btns">
    <a class="btn primary" href="reels.html">▶️ Reels (60 sec)</a>
    <a class="btn">✉️ Share</a>
  </div>
  <div class="grid">
    <div class="box">📸</div><div class="box">🎬</div><div class="box">🔥</div>
    <div class="box">🇮🇳</div><div class="box">💯</div><div class="box">⭐</div>
  </div>
</div>

<div class="nav">
  <a href="index.html">🏠</a>
  <a href="reels.html">🎬</a>
  <a>➕</a>
  <a>❤️</a>
  <a>👤</a>
</div>
</body>
</html>
