<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>Nexoly11 Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 90%;
    max-width: 400px;
    text-align: center;
    padding: 30px 20px;
}

.logo {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 10px;
}

.logo span {
    color: #ff1744;
}

.subtitle {
    color: #aaa;
    margin-bottom: 35px;
}

input {
    width: 100%;
    padding: 16px;
    margin: 10px 0;
    background: #171717;
    border: 1px solid #444;
    border-radius: 10px;
    color: white;
    font-size: 16px;
}

input:focus {
    outline: 2px solid #ff1744;
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 20px;
    background: linear-gradient(90deg,#ff1744,#9c27b0);
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

a {
    color: #ff4081;
    text-decoration: none;
}

.footer {
    margin-top: 30px;
    color: #aaa;
    font-size: 14px;
}

#message {
    color: #ffcc80;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        NEXOLY11 🇮🇳
    </div>

    <p class="subtitle">
        India's Own Social Media Platform
    </p>

    <h2>Welcome Back!</h2>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Enter Email"
            autocomplete="username"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
            autocomplete="current-password"
            required
        >

        <button type="submit">
            LOGIN
        </button>

    </form>

    <p id="message" role="status"></p>

    <div class="footer">
        New to Nexoly11?
        <br><br>
        <a href="signup.html">Create New Account</a>
        <br><br>
        <a href="index.html">Back to Home</a>
    </div>

</div>

<script>
"use strict";

document.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    document.getElementById("message").textContent =
    "Login service is not connected yet. Please try after setup.";

});
</script>

</body>
</html>
