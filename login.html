<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/home.css"><title>Nexoly11 | Login</title><style>body{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#321629 0,transparent 48%),#080808;display:grid;place-items:center;padding:20px}.auth{width:100%;max-width:430px;margin:0;background:#121114;border:1px solid #352b35;border-radius:24px;padding:26px;box-shadow:0 24px 80px #0009}.auth h1{font-size:27px;letter-spacing:-1px}.auth h1 span{color:#ff4778}.auth .muted{text-align:center}.auth h2{margin:24px 0 14px;font-size:22px}.auth .field{margin:12px 0}.auth .btn{background:linear-gradient(120deg,#ff4778,#a13d9b);color:white;border-radius:12px}.auth a{color:#ff83a2;font-weight:700}.auth-links{display:flex;justify-content:space-between;gap:10px;margin-top:18px;font-size:13px}.auth-links a{padding:8px 0}</style></head><body><main class="panel auth"><h1>NEXOLY<span>11</span> 🇮🇳</h1><p class="muted">India's own social platform</p><h2>Welcome back</h2><form id="form"><input class="field" id="email" type="email" autocomplete="username" required placeholder="Email address"><input class="field" id="password" type="password" autocomplete="current-password" required placeholder="Password"><button class="btn full">Login</button></form><p id="status" class="status"></p><div class="auth-links"><a href="signup.html">Create account</a><a href="#" id="forgot">Forgot password?</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/app.js" defer></script><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const status=document.getElementById('status');const {error}=await N11.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});status.textContent=error?.message||'Login successful';if(!error)location.replace('index.html')};document.getElementById('forgot').onclick=async e=>{e.preventDefault();const email=document.getElementById('email').value.trim();if(!email){document.getElementById('status').textContent='Pehle apna email address bharein.';return}const {error}=await N11.auth.resetPasswordForEmail(email,{redirectTo:new URL('login.html',location.href).href});document.getElementById('status').textContent=error?.message||'Password reset link email par bhej diya gaya hai.'};</script><script src="js/social-extras.js" defer></script><script src="js/theme.js"></script></body></html>
