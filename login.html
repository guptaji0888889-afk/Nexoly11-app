<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/style.css"><title>Nexoly11 | Login</title></head><body><main class="panel auth"><h1>NEXOLY11 🇮🇳</h1><p class="muted">India's own social platform</p><h2>Welcome back</h2><form id="form"><input class="field" id="email" type="email" autocomplete="username" required placeholder="Email"><input class="field" id="password" type="password" autocomplete="current-password" required placeholder="Password"><button class="btn full">Login</button></form><p id="status" class="status"></p><p class="muted">New here? <a href="signup.html">Create account</a></p><a href="index.html">Home</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/app.js" defer></script><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const {error}=await N11.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});document.getElementById('status').textContent=error?.message||'Login successful';if(!error)location.href='index.html'};</script></body></html>
