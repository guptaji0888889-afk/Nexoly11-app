<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>Nexoly11 | Search</title><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/home.css"></head><body class="home-page"><header class="home-header"><a class="brand" href="index.html">NEXOLY<span>11</span> 🇮🇳</a><div class="home-actions"><a class="notification-link" href="notifications.html" aria-label="Notifications">♧</a><a href="dashboard.html" aria-label="Profile">♙</a></div></header><main class="home-wrap"><section class="panel search-panel"><p class="eyebrow">FIND YOUR COMMUNITY</p><h1>Search</h1><input class="field" id="userSearch" type="search" placeholder="Search people by username…" autocomplete="off"><div id="searchResults" class="search-results"><p class="muted">Username type karke creators khojein.</p></div></section></main><nav class="bottomnav" aria-label="Main navigation"><a href="index.html" aria-label="Home"><span>⌂</span></a><a class="active" href="search.html" aria-label="Search"><span>⌕</span></a><a href="reels.html" aria-label="Reels"><span>▶</span></a><a class="create-nav" href="upload.html" aria-label="Create"><span>＋</span></a><a href="messages.html" aria-label="Messages"><span>✉</span></a><a href="dashboard.html" aria-label="Profile"><span>♙</span></a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/app.js" defer></script><script src="js/theme.js"></script><script>
const input=document.getElementById('userSearch'),out=document.getElementById('searchResults');let timer;input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(async()=>{const q=input.value.trim().replace(/^@/,'');if(q.length<2){out.innerHTML='<p class="muted">Kam se kam 2 letters type karein.</p>';return}if(!window.N11){out.textContent='Search service load nahi hui. Refresh karein.';return}const {data,error}=await N11.from('profiles').select('id,username,full_name,avatar_url,bio').ilike('username',`%${q}%`).limit(20);if(error){out.textContent='Search abhi available nahi hai: '+error.message;return}if(!data?.length){out.innerHTML='<p class="empty">Koi creator nahi mila.</p>';return}out.innerHTML=data.map(u=>`<a class="search-user" href="dashboard.html?user=${encodeURIComponent(u.username)}"><span class="search-avatar">${(u.username||'U').slice(0,1).toUpperCase()}</span><span><b>@${u.username}</b><small>${u.full_name||''}</small></span></a>`).join('')},250)});
</script></body></html>
