<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>Nexoly11 | Explore</title><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/home.css"><style>
body.explore-page{background:#080808;color:#fff;padding-bottom:90px}.explore-head{position:sticky;top:0;z-index:30;background:#080808;padding:14px 14px 12px;border-bottom:1px solid #242126}.explore-search{display:flex;align-items:center;gap:10px;background:#24252a;border-radius:16px;padding:0 15px;height:50px}.explore-search input{background:transparent!important;border:0!important;outline:0;width:100%;color:#fff;font-size:15px}.explore-search span{font-size:23px;color:#bbb}.explore-filters{display:flex;gap:8px;overflow:auto;padding-top:12px;scrollbar-width:none}.explore-filters button{white-space:nowrap;border:1px solid #38333d;background:#17151a;color:#eee;border-radius:20px;padding:8px 13px;font-size:12px}.explore-filters button.active{background:linear-gradient(110deg,#ff4778,#b13bbd);border-color:transparent}.explore-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:3px}.explore-tile{position:relative;aspect-ratio: .78;overflow:hidden;background:#171717;display:block}.explore-tile img,.explore-tile video{width:100%;height:100%;object-fit:cover}.explore-views{position:absolute;left:7px;bottom:7px;color:#fff;font-size:12px;text-shadow:0 1px 4px #000;background:#0005;border-radius:12px;padding:2px 5px}.explore-empty{padding:30px;text-align:center;color:#aaa;grid-column:1/-1}.explore-user-results{padding:8px 14px}.explore-user-results:empty{display:none}.explore-user{display:flex;align-items:center;gap:12px;padding:10px;color:#fff;text-decoration:none}.explore-user img{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#333}
</style></head><body class="explore-page"><header class="explore-head"><a class="brand" href="index.html">NEXOLY<span>11</span> 🇮🇳</a><label class="explore-search"><span>⌕</span><input id="exploreSearch" type="search" placeholder="Search with Nexoly11 AI"></label><div class="explore-filters"><button class="active" data-filter="all">✦ For You</button><button data-filter="trending">↗ Trending</button><button data-filter="video">▣ Reels</button><button data-filter="image">▧ Photos</button><button data-filter="Motivation">Motivation</button><button data-filter="Business">Business</button></div></header><div id="exploreUsers" class="explore-user-results"></div><main id="exploreGrid" class="explore-grid"><p class="explore-empty">Loading posts…</p></main><nav class="bottomnav" aria-label="Main navigation"><a href="index.html" aria-label="Home"><span>⌂</span></a><a class="active" href="search.html" aria-label="Explore"><span>⌕</span></a><a href="reels.html" aria-label="Reels"><span>▶</span></a><a class="create-nav" href="upload.html" aria-label="Create"><span>＋</span></a><a href="messages.html" aria-label="Messages"><span>✉</span></a><a href="dashboard.html" aria-label="Profile"><span>♙</span></a></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/app.js?v=39" defer></script><script src="js/theme.js"></script><script>
(()=>{const grid=document.getElementById('exploreGrid'),search=document.getElementById('exploreSearch'),users=document.getElementById('exploreUsers');let posts=[],filter='all';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=search.value.trim().toLowerCase();const list=posts.filter(p=>(filter==='all'||filter==='trending'||(filter==='video'?p.media_type==='video':filter==='image'?p.media_type!=='video':(p.category||'').toLowerCase()===filter.toLowerCase()))&&(!q||`${p.caption||''} ${p.category||''} ${p.username||''}`.toLowerCase().includes(q)));grid.innerHTML=list.length?list.map(p=>`<a class="explore-tile" href="${p.media_type==='video'?'reels.html':'index.html'}" aria-label="Open ${esc(p.category||'post')}">${p.media_type==='video'?`<video src="${esc(p.media_url)}#t=0.1" muted playsinline preload="metadata"></video>`:`<img src="${esc(p.media_url)}" loading="lazy" alt="Nexoly11 post">`}<span class="explore-views">◉ ${Number(p.views||0).toLocaleString('en-IN')}</span></a>`).join(''):'<p class="explore-empty">No posts found.</p>'}search.addEventListener('input',render);document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelector('[data-filter].active')?.classList.remove('active');b.classList.add('active');filter=b.dataset.filter;render()}));async function load(){if(!window.N11){grid.innerHTML='<p class="explore-empty">Service load nahi hui. Refresh karein.</p>';return}const {data,error}=await N11.from('posts').select('id,media_url,media_type,caption,category,created_at').order('created_at',{ascending:false}).limit(90);if(error){grid.innerHTML=`<p class="explore-empty">Posts load nahi hue: ${esc(error.message)}</p>`;return}posts=data||[];render()}load();})();
</script></body></html>
