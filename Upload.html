<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Nexoly11 Upload</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
background:#080808;
color:white;
font-family:Arial,sans-serif;
padding:18px;
}

h2{margin:15px 0 22px}

.card{
background:#151515;
border:1px solid #333;
padding:16px;
border-radius:14px;
}

input,textarea,select{
width:100%;
padding:13px;
margin:10px 0;
background:#222;
color:white;
border:1px solid #444;
border-radius:8px;
}

button{
width:100%;
padding:14px;
background:white;
color:black;
font-weight:bold;
border:0;
border-radius:9px;
margin-top:12px;
}

.preview{
display:none;
position:relative;
margin-top:15px;
overflow:hidden;
border-radius:12px;
background:#222;
min-height:200px;
}

.preview img,.preview video{
width:100%;
max-height:450px;
object-fit:contain;
display:block;
}

.watermark{
position:absolute;
bottom:15px;
right:12px;
text-align:right;
font-size:13px;
font-weight:bold;
color:white;
text-shadow:1px 1px 4px black;
pointer-events:none;
}

.creator{
font-size:10px;
margin-bottom:5px;
}

.note{
font-size:12px;
color:#aaa;
margin-top:12px;
line-height:1.5;
}

.post{
margin-top:20px;
padding:15px;
background:#171717;
border-radius:12px;
}
</style>
</head>

<body>

<h2>🇮🇳 NEXOLY11</h2>

<div class="card">

<h3>Create New Post</h3>

<input
type="file"
id="media"
accept="image/*,video/*"
>

<textarea
id="caption"
placeholder="Write your caption..."
rows="3"></textarea>

<select id="category">
<option value="Motivation">Motivation</option>
<option value="Business">Business</option>
<option value="Bhakti">Bhakti</option>
<option value="Education">Education</option>
<option value="Bollywood">Bollywood</option>
<option value="Rajniti">Rajniti</option>
</select>

<div class="preview" id="preview">

<img id="image" alt="Selected photo preview" hidden>

<video id="video" controls playsinline hidden></video>

<div class="watermark">
<div class="creator" id="creator"></div>
NEXOLY11 🇮🇳
</div>

</div>

<button onclick="publish()">Publish Post</button>

<p class="note">
Nexoly11 Watermark Preview.
Your original file will not be modified.
This demo does not upload media to a server.
</p>

</div>

<div id="result"></div>

<script>

  const SUPABASE_URL = "https://qaexwsxxprvtkzidmwbx.supabase.co"
const SUPABASE_KEY = "sb_publishable_LEvFzFYhxnenoBkPSwL1sA_EI-u9Htb"

const client = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
const media=document.getElementById("media");
const preview=document.getElementById("preview");
const image=document.getElementById("image");
const video=document.getElementById("video");

let selectedFile=null;
let objectURL=null;

media.addEventListener("change",function(){

const file=this.files[0];

if(!file)return;

if(!["image/jpeg","image/png","image/webp",
"image/gif","video/mp4","video/webm"].includes(file.type)){
alert("Please select a supported image or video.");
this.value="";
return;
}

if(file.size>50*1024*1024){
alert("File size must be below 50 MB.");
this.value="";
return;
}

selectedFile=file;

if(objectURL){
URL.revokeObjectURL(objectURL);
}

objectURL=URL.createObjectURL(file);

preview.style.display="block";

image.hidden=true;
video.hidden=true;

if(file.type.startsWith("image/")){
image.src=objectURL;
image.hidden=false;
}else{
video.src=objectURL;
video.hidden=false;
}

document.getElementById("creator").textContent=
"Created by @your_username";

});

function publish(){

if(!selectedFile){
alert("Please select a photo or video first.");
return;
}

const caption=document.getElementById("caption").value;
const category=document.getElementById("category").value;

const result=document.getElementById("result");

const post=document.createElement("div");
post.className="post";

const title=document.createElement("h3");
title.textContent="NEXOLY11 🇮🇳";

const details=document.createElement("p");
details.textContent="Category: "+category;

const text=document.createElement("p");
text.textContent=caption;

const status=document.createElement("p");
status.textContent="Demo Preview Only — Not Uploaded";

post.append(title,details,text,status);
result.replaceChildren(post);

alert("Post preview created! Backend connection is still required.");

}

</script>

</body>
</html>
