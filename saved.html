s||[]).map(x=>[x.id,x.username]));box.innerHTML=rows.map(p=>`<article class="post"><div class="posthead"><b>@${map[p.user_id]||'creator'}</b></div>${p.media_type==='video'?`<video class="postmedia" src="${p.media_url}" controls playsinline></video>`:`<img class="postmedia" src="${p.media_url}" alt="Saved post">`}<div class="caption">${p.caption||''}</div><button class="btn secondary" data-remove="${p.id}">Remove from Saved</button></article>`).join('')});document.addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(!b)return;const ids=JSON.parse(localStorage.getItem('n11-saved')||'[]').filter(x=>x!==b.dataset.remove);localStorage.setItem('n11-saved',JSON.stringify(ids));b.closest('.post').remove()});</script><script src="js/theme.js"></script></body></html>
