<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nexoly11 Camera Studio</title>
<style>
:root{color-scheme:dark;--accent:#ff3478}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;font-family:system-ui,-apple-system,Arial;overflow:hidden}button{font:inherit;color:inherit;border:0;cursor:pointer}.stage{position:fixed;inset:0;background:#080808;display:grid;place-items:center}.stage video{width:100%;height:100%;object-fit:cover;transform:scaleX(1)}.stage video.mirror{transform:scaleX(-1)}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#0009,transparent 18%,transparent 66%,#000b)}.grid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 33.1%,#fff7 33.3%,transparent 33.6%,transparent 66.4%,#fff7 66.6%,transparent 66.9%),linear-gradient(0deg,transparent 33.1%,#fff7 33.3%,transparent 33.6%,transparent 66.4%,#fff7 66.6%,transparent 66.9%);display:none}.top{position:absolute;top:env(safe-area-inset-top,10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:5}.pill{background:#101116c9;border:1px solid #ffffff35;border-radius:30px;padding:10px 13px;backdrop-filter:blur(12px)}.brand{font-size:14px;font-weight:900;letter-spacing:1px}.brand span{color:var(--accent)}.tools{position:absolute;right:12px;top:18%;display:flex;flex-direction:column;gap:12px;z-index:5}.tool{width:48px;height:48px;border-radius:50%;background:#11151dcc;border:1px solid #ffffff40;display:grid;place-items:center;font-size:20px}.tool small{font-size:9px;display:block}.bottom{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;z-index:5}.looks{display:flex;gap:9px;overflow:auto;padding:8px 14px 18px;scrollbar-width:none}.looks button{flex:0 0 auto;padding:9px 14px;border-radius:24px;background:#11151dcc;border:1px solid #ffffff38;font-size:12px}.looks button.active{background:#fff;color:#111}.shutter-row{display:flex;align-items:center;justify-content:center;gap:30px}.side{width:48px;height:48px;border-radius:15px;background:#16191fdd;border:1px solid #ffffff55;font-size:21px}.shutter{width:78px;height:78px;border:5px solid #fff;border-radius:50%;background:#ffffff35;display:grid;place-items:center}.shutter:after{content:'';width:58px;height:58px;background:#fff;border-radius:50%}.shutter.recording:after{width:28px;height:28px;border-radius:8px;background:#ff315b}.mode{display:flex;justify-content:center;gap:24px;margin-top:15px;font-size:12px;font-weight:800;letter-spacing:1px}.mode button{background:none;color:#aaa}.mode button.active{color:#fff}.status{position:absolute;top:76px;left:50%;transform:translateX(-50%);font-size:11px;background:#0009;padding:7px 12px;border-radius:20px;z-index:5;white-space:nowrap}.panel{position:absolute;z-index:8;left:10px;right:10px;bottom:10px;background:#17191fee;border:1px solid #ffffff26;border-radius:20px;padding:14px;display:none;backdrop-filter:blur(18px)}.panel.show{display:block}.panel h3{margin:0 0 12px;font-size:14px}.slider{display:grid;grid-template-columns:80px 1fr 32px;gap:8px;align-items:center;margin:11px 0;font-size:12px}.slider input{width:100%;accent-color:var(--accent)}.preview{position:fixed;inset:0;z-index:20;background:#050505;display:none;flex-direction:column}.preview.show{display:flex}.preview img,.preview video{width:100%;height:calc(100% - 130px);object-fit:contain;flex:1;min-height:0}.preview-actions{display:flex;gap:10px;padding:15px}.preview-actions button{flex:1;padding:14px;border-radius:14px;background:#262832;font-weight:800}.preview-actions .primary{background:var(--accent)}.hint{font-size:11px;color:#bbb;text-align:center;margin:0 12px 12px}.hidden{display:none!important}@media(min-width:700px){.stage video{max-width:520px}.stage{background:#111}.bottom{max-width:520px;left:50%;transform:translateX(-50%)}.tools{right:calc(50% - 245px)}}
</style></head>
<body>
<div class="stage"><video id="live" autoplay playsinline muted></video><div class="shade"></div><div class="grid" id="grid"></div></div>
<div class="top"><button class="pill" id="close">✕</button><div class="brand">NEXOLY<span>11</span> CAMERA</div><button class="pill" id="flash">⚡</button></div>
<div class="status" id="status">Camera start ho raha hai…</div>
<div class="tools"><button class="tool" id="flip">🔄<small>Flip</small></button><button class="tool" id="gridBtn">▦<small>Grid</small></button><button class="tool" id="timer">3s<small>Timer</small></button><button class="tool" id="settings">☼<small>Adjust</small></button><button class="tool" id="zoomPlus">＋<small>Zoom</small></button></div>
<div class="bottom"><div class="looks" id="looks"><button class="active" data-filter="none">Original</button><button data-filter="brightness(1.08) contrast(1.05) saturate(1.08)">Natural</button><button data-filter="brightness(1.12) contrast(1.08) saturate(1.2)">Glow</button><button data-filter="sepia(.28) saturate(1.15)">Warm</button><button data-filter="grayscale(1)">B&W</button><button data-filter="contrast(1.2) saturate(1.25)">Vivid</button><button data-filter="hue-rotate(18deg) saturate(1.2)">Cool</button><button data-filter="sepia(.18) contrast(1.15)">Film</button></div><div class="shutter-row"><button class="side" id="gallery">▣</button><button class="shutter" id="capture" aria-label="Capture"></button><button class="side" id="record">●</button></div><div class="mode"><button class="active" data-mode="photo">PHOTO</button><button data-mode="video">VIDEO</button></div></div>
<div class="panel" id="adjust"><h3>Camera adjustments</h3><label class="slider">Brightness<input id="bright" type="range" min="70" max="140" value="100"><b id="brightVal">100</b></label><label class="slider">Contrast<input id="contrast" type="range" min="70" max="140" value="100"><b id="contrastVal">100</b></label><label class="slider">Saturation<input id="saturate" type="range" min="0" max="160" value="100"><b id="saturateVal">100</b></label><p class="hint">Ye live visual adjustments hain; original sensor quality phone ke camera aur browser par depend karti hai.</p></div>
<div class="preview" id="preview"><div class="top"><b>Preview</b><button class="pill" id="discard">✕</button></div><div id="previewMedia"></div><div class="preview-actions"><button id="retake">Retake</button><button class="primary" id="save">Save to phone</button></div><p class="hint">Save karne ke baad file Gallery/Downloads mein milegi.</p></div>
<input type="file" id="filePicker" accept="image/*,video/*" hidden>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const live=$('live'),status=$('status');let stream=null,facing='environment',mode='photo',filter='none',zoom=1,timerSec=0,recorder=null,chunks=[],lastBlob=null,lastName='nexoly11-photo.jpg',track=null;
function say(t){status.textContent=t;status.classList.remove('hidden');clearTimeout(say.t);say.t=setTimeout(()=>status.classList.add('hidden'),2600)}
async function startCamera(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:true,video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30,max:30}}});live.srcObject=stream;track=stream.getVideoTracks()[0];live.classList.toggle('mirror',facing==='user');await live.play();say('Camera ready • '+(track.getSettings().width||'')+'×'+(track.getSettings().height||''));}catch(e){say(e.name==='NotAllowedError'?'Camera permission allow karein': 'Camera open nahi hua. HTTPS par kholein aur permission check karein.');}}
function composedFilter(){let b=+$('bright').value,c=+$('contrast').value,s=+$('saturate').value;return `${filter==='none'?'':filter+' '}brightness(${b}%) contrast(${c}%) saturate(${s}%)`}
function updateFilter(){live.style.filter=composedFilter()}
document.querySelectorAll('[data-filter]').forEach(btn=>btn.onclick=()=>{filter=btn.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===btn));updateFilter()});
document.querySelectorAll('[data-mode]').forEach(btn=>btn.onclick=()=>{mode=btn.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===btn));say(mode==='photo'?'Photo mode':'Video mode — record button dabayein')});
['bright','contrast','saturate'].forEach(id=>$(id).oninput=()=>{$(id+'Val').textContent=$(id).value;updateFilter()});
$('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';startCamera()};$('gridBtn').onclick=()=>{$('grid').style.display=$('grid').style.display==='block'?'none':'block'};
$('timer').onclick=()=>{timerSec=timerSec===0?3:timerSec===3?10:0;$('timer').innerHTML=(timerSec||'OFF')+'<small>Timer</small>'};$('settings').onclick=()=>$('adjust').classList.toggle('show');$('zoomPlus').onclick=()=>{zoom=zoom>=2.5?1:Math.min(2.5,zoom+.25);live.style.transform=`scale(${zoom})${facing==='user'?' scaleX(-1)':''}`;say('Zoom '+zoom.toFixed(2)+'×')};
$('flash').onclick=async()=>{try{if(!track?.getCapabilities().torch)throw 0;let on=!track.getSettings().torch;await track.applyConstraints({advanced:[{torch:on}]});say(on?'Flash ON':'Flash OFF')}catch{say('Flash is phone/browser support par depend karta hai')}};
function waitTimer(){return new Promise(resolve=>{if(!timerSec)return resolve();let n=timerSec;say('Photo '+n+'…');let t=setInterval(()=>{n--;if(n<=0){clearInterval(t);resolve()}else say('Photo '+n+'…')},1000)})}
function captureFrame(){const w=live.videoWidth,h=live.videoHeight;if(!w||!h){say('Camera abhi ready nahi hai');return}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.filter=composedFilter();if(facing==='user'){ctx.translate(w,0);ctx.scale(-1,1)}ctx.drawImage(live,0,0,w,h);canvas.toBlob(blob=>showPreview(blob,'image'),'image/jpeg',.94)}
$('capture').onclick=async()=>{if(mode==='video'){toggleRecording();return}await waitTimer();captureFrame()};
function toggleRecording(){if(recorder?.state==='recording'){recorder.stop();$('record').textContent='●';$('capture').classList.remove('recording');return}try{const canvas=document.createElement('canvas'),w=live.videoWidth,h=live.videoHeight;canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');let raf;const draw=()=>{ctx.filter=composedFilter();if(facing==='user'){ctx.save();ctx.translate(w,0);ctx.scale(-1,1);ctx.drawImage(live,0,0,w,h);ctx.restore()}else ctx.drawImage(live,0,0,w,h);raf=requestAnimationFrame(draw)};draw();const videoStream=canvas.captureStream(30);const audio=stream?.getAudioTracks()||[];audio.forEach(t=>videoStream.addTrack(t));const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';recorder=new MediaRecorder(videoStream,{mimeType:mime});chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{cancelAnimationFrame(raf);showPreview(new Blob(chunks,{type:'video/webm'}),'video');videoStream.getTracks().forEach(t=>t.stop())};recorder.start();$('record').textContent='■';$('capture').classList.add('recording');say('Recording… record button dabakar stop karein')}catch(e){say('Video recording is browser par supported nahi hai')}}
$('record').onclick=()=>{mode='video';document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode==='video'));toggleRecording()};
function showPreview(blob,type){lastBlob=blob;lastName=type==='image'?'nexoly11-'+Date.now()+'.jpg':'nexoly11-'+Date.now()+'.webm';const url=URL.createObjectURL(blob);$('previewMedia').innerHTML=type==='image'?`<img src="${url}" alt="Captured photo">`:`<video src="${url}" controls autoplay playsinline></video>`;$('preview').classList.add('show')}
function closePreview(){$('preview').classList.remove('show');$('previewMedia').innerHTML='';lastBlob=null}
$('save').onclick=()=>{if(!lastBlob)return;const url=URL.createObjectURL(lastBlob),a=document.createElement('a');a.href=url;a.download=lastName;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);say('File save ho rahi hai');closePreview()};$('discard').onclick=closePreview;$('retake').onclick=closePreview;
$('gallery').onclick=()=>$('filePicker').click();$('filePicker').onchange=e=>{const f=e.target.files[0];if(f){lastBlob=f;lastName=f.name;const u=URL.createObjectURL(f);$('previewMedia').innerHTML=f.type.startsWith('video/')?`<video src="${u}" controls playsinline></video>`:`<img src="${u}">`;$('preview').classList.add('show')}e.target.value=''};
$('close').onclick=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());location.href='upload.html'};
if(!navigator.mediaDevices?.getUserMedia){say('Camera ke liye HTTPS ya localhost zaroori hai')}else startCamera();
})();
</script></body></html>
