<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;text-align:center}
.top{display:flex;justify-content:space-between;padding:12px 14px}
.top b{font-size:22px}
#previewWrap{position:relative;width:94%;margin:10px auto}
#preview{width:100%;height:52vh;object-fit:cover;background:#222;display:block;border-radius:12px;border:2px solid #333}
#textOverlay{position:absolute;left:0;right:0;top:45%;text-align:center;font-size:28px;font-weight:900;text-shadow:0 2px 8px #000;pointer-events:none;padding:0 10px;word-break:break-word}
#stickerOverlay{position:absolute;top:10px;right:10px;font-size:44px}
.big{width:90%;padding:14px;border:0;border-radius:20px;font-weight:800;font-size:14px;margin:5px}
.b1{background:#ff5fa2;color:#fff}.b2{background:#fff;color:#000}
.fBar{display:flex;gap:8px;overflow-x:auto;padding:10px}
.fBar::-webkit-scrollbar{display:none}
.fItem{flex-shrink:0;text-align:center}
.fItem .fc{width:46px;height:46px;border-radius:50%;background:#222;border:2px solid #444;display:flex;align-items:center;justify-content:center;font-size:18px}
.fItem.active .fc{border-color:#fff;background:#ff5fa2}
.editBox{background:#111;margin:10px;padding:12px;border-radius:16px;border:1px solid #ff5fa2;text-align:left}
.editBox h3{font-size:14px;color:#ff5fa2;text-align:center;margin-bottom:10px}
.editRow{margin-bottom:10px}
.editRow label{font-size:12px;display:flex;justify-content:space-between}
.editRow input[type=range]{width:100%;accent-color:#ff5fa2}
.editRow input[type=text]{width:100%;padding:10px;border-radius:10px;background:#222;color:#fff;border:1px solid #333;margin-top:4px}
.stickerRow{display:flex;gap:8px;overflow-x:auto}
.stickerRow button{flex-shrink:0;width:44px;height:44px;border-radius:50%;border:2px solid #333;background:#222;font-size:20px}
.toolRow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:8px}
.toolRow button{padding:10px 4px;border:0;border-radius:10px;background:#222;color:#fff;font-size:11px;font-weight:700}
.shareBox{background:#111;margin:10px;padding:12px;border-radius:16px;border:1px solid #333}
.shareBtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.shareBtns button{padding:12px 4px;border:0;border-radius:12px;font-weight:800;font-size:11px}
.sStory{background:#ff5fa2;color:#fff}.sReel{background:#fff;color:#000}.sPost{background:#0095f6;color:#fff}.sWA{background:#25D366;color:#fff}.sDL{background:#00c853;color:#fff}.sDel{background:#ff3b30;color:#fff}
#grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:10px}
#grid img{width:100%;height:120px;object-fit:cover;border-radius:10px}
</style>
</head>
<body>
<div class="top"><span>←</span><b>inshot</b><span>+</span></div>
<p style="background:#ff5fa2;padding:8px;font-size:13px;font-weight:700" id="msg">1. CAMERA KHOLO > 2. EDIT karo > 3. STORY / REELS dabao</p>
<div id="previewWrap"><img id="preview" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600"><div id="textOverlay"></div><div id="stickerOverlay"></div></div>
<p style="color:#0f0;font-size:12px">● Fog Effect LIVE</p>
<div class="fBar">
<div class="fItem active" data-f="Original"><div class="fc">📷</div><span>Original</span></div>
<div class="fItem" data-f="Fog"><div class="fc">🌫
