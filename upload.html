<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexoly11 Camera Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .phone-frame {
            width: 100%;
            max-width: 410px;
            height: 100vh;
            max-height: 850px;
            background: #121212;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-radius: 0px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        @media (min-width: 450px) {
            .phone-frame {
                border-radius: 40px;
                border: 8px solid #2a2a2a;
            }
        }
        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
        }
        .logo {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(45deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Viewfinder Area */
        .viewfinder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80') no-repeat center center/cover;
        }
        .viewfinder::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        }
        /* Controls Overlay */
        .overlay-content {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%;
            padding: 20px;
        }
        /* AI & Quality Panel */
        .panels-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .panel {
            flex: 1;
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px;
        }
        .panel-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ai-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 8px;
            color: #fff;
            font-size: 11px;
            margin-bottom: 8px;
            resize: none;
            height: 40px;
        }
        .preset-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
        }
        .preset-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 6px;
            padding: 4px 8px;
            color: #fff;
            font-size: 9px;
            white-space: nowrap;
            cursor: pointer;
        }
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .slider-item {
            font-size: 9px;
            display: flex;
            justify-content: space-between;
            color: #ccc;
        }
        .slider-item input {
            width: 60px;
        }
        /* Bottom Navigation Modes */
        .mode-nav {
            display: flex;
            justify-content: space-around;
            font-size: 12px;
            font-weight: 500;
            color: #888;
            margin-bottom: 15px;
        }
        .mode-nav .active {
            color: #ffffff;
            font-weight: 700;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 2px;
        }
        /* Shutter Bar */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gallery-preview {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.3);
            overflow: hidden;
            background: #333;
        }
        .gallery-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .shutter-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
        }
        .shutter-inner {
            width: 63px;
            height: 63px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.1s;
        }
        .shutter-btn:active .shutter-inner {
            transform: scale(0.9);
        }
        .flip-btn {
            font-size: 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- Background Camera View -->
        <div class="viewfinder"></div>

        <!-- Top Header -->
        <div class="header">
            <div class="logo">✨ Nexoly11 Camera Pro</div>
            <div style="font-size: 18px; cursor: pointer;">⚙️</div>
        </div>

        <!-- Overlay UI -->
        <div class="overlay-content">
            
            <!-- AI & Pro Controls Panels -->
            <div class="panels-container">
                <!-- AI Panel -->
                <div class="panel">
                    <div class="panel-title">
                        <span>AI Generator</span>
                        <input type="checkbox" checked style="accent-color: #3b82f6;">
                    </div>
                    <textarea class="auto-input ai-input" placeholder="Compose with AI (e.g., At Taj Mahal)..."></textarea>
                    <div class="preset-row">
                        <button class="preset-btn">Portraits</button>
                        <button class="preset-btn">Landscapes</button>
                        <button class="preset-btn">Artistic</button>
                    </div>
                </div>

                <!-- Pro Quality Panel -->
                <div class="panel">
                    <div class="panel-title">Pro Quality</div>
                    <div class="slider-group">
                        <div class="slider-item"><span>4K Res</span> <input type="range" min="1" max="100" value="85"></div>
                        <div class="slider-item"><span>AI Face</span> <input type="range" min="1" max="100" value="70"></div>
                        <div class="slider-item"><span>Depth</span> <input type="range" min="1" max="100" value="60"></div>
                    </div>
                </div>
            </div>

            <!-- Mode Selection (Instagram Style) -->
            <div class="mode-nav">
                <span class="active">AI PIC</span>
                <span>PRO VIDEO</span>
                <span>CINEMATIC STORY</span>
                <span>RAW PHOTO</span>
            </div>

            <!-- Bottom Shutter & Gallery -->
            <div class="bottom-bar">
                <div class="gallery-preview">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Gallery">
                </div>
                
                <div class="shutter-btn" onclick="captureAction()">
                    <div class="shutter-inner"></div>
                </div>

                <button class="flip-btn">🔄</button>
            </div>

        </div>
    </div>

    <script>
        function captureAction() {
            alert("✨ AI Photo Captured & Processed in 4K Quality!");
            // यहाँ आप अपने Supabase स्टोरेज या अपलोड लॉजिक को जोड़ सकते हैं।
        }
    </script>
</body>
</html>
