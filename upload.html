<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nexoly11 Pro - Ultra Quality</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:system-ui,Arial;overflow:hidden;height:100dvh;width:100vw;position:fixed}
#camWrap{position:fixed;inset:0;width:100%;height:100%;background:#000;z-index:1;overflow:hidden}
#video{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(1.18) contrast(1.08) saturate(1.25)}
#fxCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#fogLayer{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:0;transition:0.6s;background:radial-gradient(ellipse at 30% 40%,rgba(255,255,255,.55) 0%,transparent 55%),radial-gradient(ellipse at 70% 60%,rgba(255,255,255,.5) 0%,transparent 50%),linear-gradient(to bottom,rgba(255,255,255,.25),transparent 60%)}
#canvas{display:none}
.topBar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:linear-gradient(to bottom,rgba(0,0,0,.75),transparent)}
.logo{font-weight:900;font-size:18px;background:linear-gradient(90deg,#ff2d95,#a855f7,#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topBtns{display:flex;gap:8px}
.iconBtn{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none}
#drawer{position:fixed;top:0;right:-92%;width:88%;max-width:360px;height:100%;background:#121218;z-index:21;transition:.3s ease;padding:16px;overflow-y:auto;border-radius:20px 0 0 20px;border-left:1px solid #333}
#drawer.open{right:0}
#overlay.show{display:block}
.dHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dHead b{font-size:19px;color:#ff2d95}
.closeBtn{width:36px;height:36px;border-radius:50%;background:#222;border:0;color:#fff;font-size:18px}
.qualityBadge{display:flex;gap:6px;margin:10px 0}
.qb{flex:1;text-align:center;padding:8px;border-radius:10px;background:#1e1e28;font-size:12px;font-weight:700;border:1px solid #333}
.qb.active{background:#a855f7;border-color:#a855f7}
.ctrl{margin:14px 0}
.ctrl label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;color:#ddd}
input[type=range]{width:100%;accent-color:#ff2d95;height:28px}
.chipRow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{padding:9px 13px;border-radius:20px;background:#222;border:1px solid #333;color:#fff;font-size:13px}
.chip.active{background:#ff2d95;border-color:#ff2d95;font-weight:700;box-shadow:0 0 12px #ff2d95}
.checkRow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.checkRow label{background:#1e1e28;padding:8px 10px;border-radius:10px;font-size:13px;display:flex;gap:6px;align-items:center}
.resetBtn{width:100%;padding:12px;border:0;border-radius:12px;background:#222;color:#fff;font-weight:700;margin-top:16px}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:10px 12px 18px;background:linear-gradient(to top,rgba(0,0,0,.9),transparent)}
.modes{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.mode{white-space:nowrap;padding:8px 16px;border-radius:20px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:13px;font-weight:600}
.mode.active{background:#fff;color:#000}
.centerRow{display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.thumb{width:52px;height:52px;border-radius:12px;overflow:hidden;border:2px solid #fff;background:#222}
.thumb img{width:100%;height:100%;object-fit:cover}
.shutter{width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid #ff2d95;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 0 0 4px rgba(255,255,255,.3)}
.flip{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.3);font-size:24px;color:#fff}
.actionRow{display:flex;gap:10px;margin-top:12px}
.capBtn{flex:1;padding:14px;border:0;border-radius:14px;background:#a855f7;color:#fff;font-weight:800;font-size:15px}
.recBtn{flex:1;padding:14px;border:0;border-radius:14px;background:#ff2d95;color:#fff;font-weight:800;font-size:15px}
.recBtn.rec{background:red;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.6}}
#status{text-align:center;font-size:12px;margin-top:8px;color:#ddd}
#gallery{display:flex;gap:8px;overflow-x:auto;margin-top:10px}
#gallery img{width:64px;height:74px;object-fit:cover;border-radius:10px;border:1px solid #333}
#msg{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:10px 16px;border-radius:20px;z-index:30;font-size:13px;display:none;white-space:nowrap}
</style>
</head>
<body>
<div id="camWrap"><video id="video" autoplay playsinline muted></video><canvas id="fxCanvas"></canvas><div id="fogLayer"></div></div>
<canvas id="canvas"></canvas><div id="msg"></div>
<div class="topBar"><div class="logo">✨ Nexoly11 Pro</div><div class="topBtns"><div class="iconBtn" onclick="toggleFlip()">🔄</div><div class="iconBtn" onclick="toggleFlash()">⚡</div><div class="iconBtn" onclick="openDrawer()">⚙️</div></div></div>
<div id="overlay" onclick="closeDrawer()"></div>
<div id="drawer">
<div class="dHead"><b>✨ Beauty + Quality</b><button class="closeBtn" onclick="closeDrawer()">✕</button></div>
<div class="qualityBadge"><div class="qb active" id="q4k" onclick="setQ('4K',this)">4K ULTRA</div><div class="qb" id="qHD" onclick="setQ('HD',this)">HD CLEAR</div><div class="qb" id="qSoft" onclick="setQ('SOFT',this)">SOFT</div></div>
<div class="ctrl"><label><span>Beauty Smooth Skin</span><span id="vBeauty">75%</span></label><input type="range" id="beauty" min="0" max="100" value="75"></div>
<div class="ctrl"><label><span>Bright - Clear</span><span id="vBright">78%</span></label><input type="range" id="bright" min="0" max="100" value="78"></div>
<div class="ctrl"><label><span>Pink Glow</span><span id="vPink">65%</span></label><input type="range" id="pink" min="0" max="100" value="65"></div>
<div class="ctrl"><label><span>Sharpness / Clarity</span><span id="vSharp">85%</span></label><input type="range" id="sharp" min="0" max="100" value="85"></div>
<div class="ctrl"><label><span>Zoom</span><span id="vZoom">1.0x</span></label><input type="range" id="zoom" min="10" max="30" value="10"></div>
<div class="ctrl"><label>🔥 Premium Filters - High Quality</label><div class="chipRow" id="filters">
<button class="chip active" data-f="Normal">✨ Normal - Clear</button>
<button class="chip" data-f="Golden Hour">☀️ Golden Hour Pro</button>
<button class="chip" data-f="Portrait Blur">👤 Portrait Blur Pro</button>
<button class="chip" data-f="Rain">🌧️ Real Rain</button>
<button class="chip" data-f="Sea">🌊 Sea Blue</button>
<button class="chip" data-f="Fog">🌫️ Real Fog</button>
<button class="chip" data-f="Night">🌙 Night Clear</button>
<button class="chip" data-f="Cinematic">🎬 Cinematic</button>
</div></div>
<div class="ctrl"><label>Rain / Fog Intensity</label><input type="range" id="intensity" min="20" max="100" value="70"></div>
<div class="checkRow"><label><input type="checkbox" id="c4k" checked> 4K Active</label><label><input type="checkbox" id="cHdr" checked> HDR Active</label><label><input type="checkbox" id="cAi" checked> AI Enhance ON</label><label><input type="checkbox" id="cGrid" checked> Grid</label><label><input type="checkbox" id="cFlash"> Flash / Torch</label></div>
<button class="resetBtn" onclick="resetAll()">↺ Beauty Reset</button>
<p style="font-size:12px;color:#888;margin-top:12px;text-align:center">Rain me asli boondein girengi.<br>Fog me asli dhuan lagega.</p>
</div>
<div class="bottom"><div class="modes" id="modes"><button class="mode active" data-m="PHOTO">PHOTO</button><button class="mode" data-m="VIDEO">VIDEO</button><button class="mode" data-m="PORTRAIT">PORTRAIT</button><button class="mode" data-m="REEL VIDEO">REEL VIDEO</button><button class="mode" data-m="SLO-MO">SLO-MO</button><button class="mode" data-m="PANORAMA">PANORAMA</button></div>
<div class="centerRow"><div class="thumb"><img id="lastImg"></div><div class="shutter" onclick="capture()">📸</div><button class="flip" onclick="toggleFlip()">🔄</button></div>
<div class="actionRow"><button class="capBtn" onclick="capture()">📸 CAPTURE PHOTO - 4K</button><button class="recBtn" id="recBtn" onclick="toggleRec()">🔴 START REEL</button></div>
<div id="status">Applied ✓ : Normal Clear • 4K Ultra</div><div id="gallery"></div></div>
<script>
let video=document.getElementById('video'),canvas=document.getElementById('canvas'),fx=document.getElementById('fxCanvas'),fctx=fx.getContext('2d'),stream=null,facing='user',currentFilter='Normal',currentMode='PHOTO',isRec=false,recorder=null,chunks=[],flashOn=false,quality='4K';
let beauty=75,bright=78,pink=65,sharp=85,zoom=1,intensity=70,raindrops=[];
function resizeFx(){fx.width=fx.offsetWidth;fx.height=fx.offsetHeight} window.addEventListener('resize',resizeFx); resizeFx();
for(let i=0;i<120;i++) raindrops.push({x:Math.random()*1000,y:Math.random()*1000,len:12+Math.random()*18,speed:8+Math.random()*12});
function drawRain(){ fctx.clearRect(0,0,fx.width,fx.height); if(currentFilter!=='Rain') return; fctx.strokeStyle='rgba(255,255,255,0.65)'; fctx.lineWidth=1.2; let n=Math.floor(intensity); for(let i=0;i<n;i++){let d=raindrops[i%raindrops.length]; let x=(d.x/1000)*fx.width, y=(d.y/1000)*fx.height; fctx.beginPath(); fctx.moveTo(x,y); fctx.lineTo(x-3,y+d.len); fctx.stroke(); d.y+=d.speed; if(d.y>1000) d.y=0; } requestAnimationFrame(drawRain); }
async function startCam(){ try{ if(stream) stream.getTracks().forEach(t=>t.stop()); stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:3840},height:{ideal:2160}},audio:false}); video.srcObject=stream; applyFilter(); showMsg('4K Ultra Quality ON 📸'); }catch(e){ showMsg('Camera Allow karo'); } }
function applyFilter(){
 let b=1+(bright-50)/90, s=1+(pink)/140, con=1+sharp/400;
 let f=`brightness(${b}) contrast(${con}) saturate(${s})`;
 if(currentFilter==='Golden Hour') f+=` sepia(0.38) hue-rotate(-12deg) saturate(1.5) brightness(1.1)`;
 if(currentFilter==='Portrait Blur') f+=` contrast(1.12) saturate(1.3)`;
 if(currentFilter==='Rain') f+=` contrast(1.18) brightness(0.92) saturate(1.1)`;
 if(currentFilter==='Sea') f+=` hue-rotate(160deg) saturate(1.55) brightness(1.05) contrast(1.1)`;
 if(currentFilter==='Fog') f+=` brightness(1.25) contrast(0.82) saturate(0.85)`;
 if(currentFilter==='Night') f+=` brightness(0.75) contrast(1.25) saturate(1.2)`;
 if(currentFilter==='Cinematic') f+=` contrast(1.25) saturate(0.9) sepia(0.2)`;
 video.style.filter=f; video.style.transform=`scale(${zoom})`;
 document.getElementById('fogLayer').style.opacity = currentFilter==='Fog' ? (intensity/100) : 0;
 document.getElementById('status').innerText=`Applied ✓ : ${currentFilter} • ${currentMode} • ${quality} • Beauty ${beauty}%`;
 if(currentFilter==='Rain') requestAnimationFrame(drawRain); else fctx.clearRect(0,0,fx.width,fx.height);
}
function setQ(q,el){quality=q;document.querySelectorAll('.qb').forEach(x=>x.classList.remove('active'));el.classList.add('active'); if(q==='4K'){bright=78;sharp=85} if(q==='HD'){bright=85;sharp=95} if(q==='SOFT'){bright=72;sharp=40} applyFilter(); showMsg(q+' Quality Lag Gayi ✨')}
function showMsg(t){let m=document.getElementById('msg');m.innerText=t;m.style.display='block';setTimeout(()=>m.style.display='none',2000)}
function openDrawer(){document.getElementById('drawer').classList.add('open');document.getElementById('overlay').classList.add('show')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
function toggleFlip(){facing=facing==='user'?'environment':'user';startCam()}
async function toggleFlash(){flashOn=!flashOn; try{let tr=stream.getVideoTracks()[0]; await tr.applyConstraints({advanced:[{torch:flashOn}]}); showMsg(flashOn?'Flash ON ⚡':'Flash OFF')}catch(e){showMsg('Flash support nahi')}}
function resetAll(){beauty=75;bright=78;pink=65;sharp=85;zoom=1;updateLabels();applyFilter();showMsg('Reset ho gaya')}
function updateLabels(){document.getElementById('vBeauty').innerText=beauty+'%';document.getElementById('vBright').innerText=bright+'%';document.getElementById('vPink').innerText=pink+'%';document.getElementById('vSharp').innerText=sharp+'%';document.getElementById('vZoom').innerText=zoom.toFixed(1)+'x'}
document.getElementById('beauty').oninput=e=>{beauty=+e.target.value;updateLabels();applyFilter()};
document.getElementById('bright').oninput=e=>{bright=+e.target.value;updateLabels();applyFilter()};
document.getElementById('pink').oninput=e=>{pink=+e.target.value;updateLabels();applyFilter()};
document.getElementById('sharp').oninput=e=>{sharp=+e.target.value;updateLabels();applyFilter()};
document.getElementById('zoom').oninput=e=>{zoom=e.target.value/10;updateLabels();applyFilter()};
document.getElementById('intensity').oninput=e=>{intensity=+e.target.value;applyFilter()};
document.querySelectorAll('#filters .chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('#filters .chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');currentFilter=c.dataset.f;applyFilter();showMsg(currentFilter+' Lag Gaya ✨')});
document.querySelectorAll('#modes .mode').forEach(m=>m.onclick=()=>{document.querySelectorAll('#modes .mode').forEach(x=>x.classList.remove('active'));m.classList.add('active');currentMode=m.dataset.m;applyFilter()});
function capture(){ if(!stream) return showMsg('Pehle Camera Allow karo'); canvas.width=video.videoWidth||1920; canvas.height=video.videoHeight||1080; let ctx=canvas.getContext('2d'); ctx.filter=video.style.filter; ctx.translate(canvas.width,0); ctx.scale(-1,1); ctx.drawImage(video,0,0); let url=canvas.toDataURL('image/jpeg',1.0); document.getElementById('lastImg').src=url; let g=document.getElementById('gallery'); let im=document.createElement('img'); im.src=url; im.onclick=()=>window.open(url); g.prepend(im); let a=document.createElement('a'); a.href=url; a.download='Nexoly11_4K_'+Date.now()+'.jpg'; a.click(); showMsg('4K Photo Save! 📸'); }
function toggleRec(){ if(!isRec){ chunks=[]; recorder=new MediaRecorder(stream); recorder.ondataavailable=e=>chunks.push(e.data); recorder.onstop=()=>{let blob=new Blob(chunks,{type:'video/webm'}); let u=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=u; a.download='Nexoly11_Reel_'+Date.now()+'.webm'; a.click(); showMsg('Reel Save!')}; recorder.start(); isRec=true; document.getElementById('recBtn').innerText='⏹ STOP REEL'; document.getElementById('recBtn').classList.add('rec'); } else{ recorder.stop(); isRec=false; document.getElementById('recBtn').innerText='🔴 START REEL'; document.getElementById('recBtn').classList.remove('rec'); } }
startCam();
</script>
</body>
</html>
