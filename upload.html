<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexoly11</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;text-align:center}
#video{width:100%;height:70vh;object-fit:cover;background:#222}
button{padding:14px 20px;border:0;border-radius:20px;background:#ff5fa2;color:#fff;font-weight:800;margin:6px;font-size:15px}
#msg{background:#ff5fa2;padding:10px}
</style>
</head>
<body>
<h3>Nexoly11 ✨ B612</h3>
<div id="msg">Camera ke liye neeche button dabao</div>
<video id="video" autoplay playsinline muted></video><br>
<button onclick="startCam()">📸 CAMERA ON KARO</button>
<button onclick="takePhoto()">📸 PHOTO LO</button>
<canvas id="canvas" style="display:none"></canvas>
<div id="pics"></div>
<script>
let video=document.getElementById('video');
async function startCam(){
  try{
    let s=await navigator.mediaDevices.getUserMedia({video:true});
    video.srcObject=s;
    document.getElementById('msg').innerText='Camera ON ✅ Ab Photo Lo!';
  }catch(e){
    document.getElementById('msg').innerText='❌ Allow dabao - Chrome me kholo';
    alert('Chrome me kholo aur Allow dabao');
  }
}
function takePhoto(){
  let c=document.getElementById('canvas');
  c.width=video.videoWidth; c.height=video.videoHeight;
  c.getContext('2d').drawImage(video,0,0);
  let img=document.createElement('img');
  img.src=c.toDataURL('image/jpeg');
  img.style.width='150px'; img.style.margin='5px'; img.style.borderRadius='10px';
  document.getElementById('pics').appendChild(img);
  let a=document.createElement('a'); a.href=img.src; a.download='photo.jpg'; a.click();
  document.getElementById('msg').innerText='Photo Save Ho Gayi ✅';
}
</script>
</body>
</html>
