<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><title>Nexoly11 Create</title>
<link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/home.css">
<style>
body{background:#08090d;color:#fff}.create-wrap{max-width:650px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#111218}.head a{color:#fff;text-decoration:none}.panel{background:#14151b;border:1px solid #30313a;border-radius:18px;padding:16px;margin:14px 0}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:800;background:#f32f78;color:white;cursor:pointer}.btn.secondary{background:#292b35;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions>*{flex:1}.preview{display:block;width:100%;max-height:55vh;object-fit:contain;background:#000;border-radius:12px;margin-top:12px}.field{width:100%;padding:13px;margin:7px 0;background:#20212a;border:1px solid #383a45;color:white;border-radius:10px}.muted{color:#aeb0bc;font-size:13px}.progress{height:5px;background:#292b35;border-radius:8px;overflow:hidden}.progress i{display:block;width:0;height:100%;background:#f32f78}.hide{display:none!important}
</style></head><body>
<header class="head"><a href="index.html">← Back</a><b>NEXOLY11 🇮🇳</b><span>Create</span></header>
<main class="create-wrap">
<section class="panel"><h2>✨ Create post</h2><p class="muted">Nexoly11 AR Camera se capture karein ya gallery se media choose karein.</p>
<div class="actions"><a class="btn" href="deep-ar-camera.html" style="text-align:center;text-decoration:none">Open Nexoly11 AR Camera</a><label class="btn secondary" style="text-align:center">Choose from Gallery<input id="media" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm" hidden></label></div>
<div id="previewArea" class="hide"><div id="previewMount"></div><p class="muted">Preview ready — publish se pehle caption/category add karein.</p></div>
</section>
<section class="panel"><label>Caption<textarea id="caption" class="field" rows="3" placeholder="Aap kya share karna chahte hain?"></textarea></label>
<label>Category<select id="category" class="field"><option value="general">General</option><option value="motivation">Motivation</option><option value="business">Business</option><option value="bhakti">Bhakti</option><option value="education">Education</option><option value="bollywood">Bollywood</option><option value="politics">Rajniti</option></select></label>
<label>Background music (optional)<input id="music" class="field" type="file" accept="audio/*"></label>
<div class="progress"><i id="progress"></i></div><p id="status" class="muted" role="status">Ready to create.</p><button id="publish" class="btn" style="width:100%">Publish to Nexoly11</button>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/app.js"></script>
<script>
(async function(){
 const $=id=>document.getElementById(id), params=new URLSearchParams(location.search);
 const media=$('media'), area=$('previewArea'), mount=$('previewMount');
 function showFile(file){if(!file)return;mount.innerHTML='';const url=URL.createObjectURL(file);let el;if(file.type.startsWith('video/')){el=document.createElement('video');el.controls=true;el.playsInline=true}else{el=document.createElement('img');el.alt='Selected media'}el.src=url;el.className='preview';mount.append(el);area.classList.remove('hide');}
 media.addEventListener('change',()=>showFile(media.files[0]));
 async function takeTransfer(){try{const db=await new Promise((resolve,reject)=>{const r=indexedDB.open('nexoly11-media-transfer',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('pending'))r.result.createObjectStore('pending')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});const item=await new Promise((resolve,reject)=>{const r=db.transaction('pending','readonly').objectStore('pending').get('camera-media');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});if(item&&item.blob){const ext=item.kind==='video'?'webm':'jpg';const file=new File([item.blob],'nexoly11-camera-'+Date.now()+'.'+ext,{type:item.blob.type||(item.kind==='video'?'video/webm':'image/jpeg')});const dt=new DataTransfer();dt.items.add(file);media.files=dt.files;showFile(file);const tx=db.transaction('pending','readwrite');tx.objectStore('pending').delete('camera-media');} }catch(e){console.warn('Camera transfer:',e)}}
 await takeTransfer();
 if(params.get('type')==='story'){$('category').value='general'}
 $('publish').addEventListener('click',async()=>{if(!media.files.length){$('status').textContent='Pehle camera se photo/video banayein ya gallery se choose karein.';return}if(!window.N11UI?.upload){$('status').textContent='App upload module load nahi hua. Page refresh karein.';return}await window.N11UI.upload()});
})();
</script></body></html>
