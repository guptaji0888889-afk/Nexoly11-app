<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexoly11 Reels & Story Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }
        .app-container {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #111;
            overflow: hidden;
        }
        #camera-feed, #recorded-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        #recorded-video {
            display: none;
            z-index: 2;
        }
        .viewfinder-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75%;
            background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.3), transparent);
            z-index: 3;
        }
        /* Top Header */
        .header {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }
        .logo {
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .top-tools {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .tool-btn {
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(8px);
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        /* Recording Timer Badge */
        #rec-timer {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            z-index: 15;
            display: none;
        }
        /* Overlay UI */
        .overlay-content {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px 15px 25px 15px;
            gap: 10px;
            width: 100%;
        }
        /* AI & Filters Panel */
        .panels-container {
            display: flex;
            gap: 8px;
        }
        .panel {
            flex: 1;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 10px;
        }
        .panel-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffaa00;
        }
        .preset-row {
            display: flex;
            gap: 5px;
            overflow-x: auto;
        }
        .preset-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            color: #fff;
            font-size: 9px;
            white-space: nowrap;
            cursor: pointer;
        }
        .preset-btn:hover { background: #dd2a7b; }
        
        /* Mode Navigation */
        .mode-nav {
            display: flex;
            justify-content: space-around;
            font-size: 12px;
            font-weight: 700;
            color: #888;
            letter-spacing: 1px;
        }
        .mode-nav .active {
            color: #ff5e00;
            text-shadow: 0 0 10px rgba(255,94,0,0.5);
            border-bottom: 2px solid #ff5e00;
            padding-bottom: 2px;
        }
        /* Bottom Shutter Bar */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }
        .gallery-preview {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: 2px solid #fff;
            overflow: hidden;
            background: #222;
            cursor: pointer;
        }
        .gallery-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .shutter-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(221, 42, 123, 0.8);
        }
        .shutter-inner {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #fff;
            transition: all 0.2s;
        }
        .recording .shutter-inner {
            background: #ff0000;
            border-radius: 8px;
            transform: scale(0.6);
        }
        .flip-btn {
            font-size: 18px;
            background: rgba(255,255,255,0.2);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        #file-input { display: none; }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: #1a1a1a;
            border: 1px solid #333;
            width: 100%;
            max-width: 350px;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-title { font-size: 15px; font-weight: bold; color: #ff5e00; }
        .song-item {
            padding: 10px;
            background: #2a2a2a;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }
        .song-item:hover { background: #dd2a7b; }
        .close-modal {
            background: #444;
            border: none;
            color: #fff;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Live Camera Feed -->
        <video id="camera-feed" autoplay playsinline muted></video>
        <!-- Recorded Reel/Story Preview -->
        <video id="recorded-video" controls playsinline></video>
        
        <div class="viewfinder-overlay"></div>
        <div id="rec-timer">🔴 REC 00:00</div>

        <!-- Top Header with Real Interactive Tools -->
        <div class="header">
            <div class="logo">✨ Nexoly11 Reels</div>
            <div class="top-tools">
                <button class="tool-btn" onclick="openMusicModal()" id="active-song-btn">🎵 Music</button>
                <button class="tool-btn" onclick="openTextModal()">✏️ Text</button>
            </div>
        </div>

        <!-- Overlay UI -->
        <div class="overlay-content">
            
            <!-- AI Filters Panel -->
            <div class="panels-container">
                <div class="panel">
                    <div class="panel-title">
                        <span>✨ AI Pro Filters</span>
                        <span id="active-filter-name" style="font-size:9px; color:#fff;">Normal HD</span>
                    </div>
                    <div class="preset-row">
                        <button class="preset-btn" onclick="setFilterEffect('normal', 'Normal HD')">Normal</button>
                        <button class="preset-btn" onclick="setFilterEffect('portrait', 'AI Portrait')">AI Portrait</button>
                        <button class="preset-btn" onclick="setFilterEffect('cinematic', 'Cinematic 4K')">Cinematic</button>
                        <button class="preset-btn" onclick="setFilterEffect('cyberpunk', 'Neon Cyber')">Cyberpunk</button>
                    </div>
                </div>
            </div>

            <!-- Mode Selection -->
            <div class="mode-nav">
                <span class="active" onclick="switchMode(this, 'STORY')">STORY</span>
                <span onclick="switchMode(this, 'REEL')">REEL</span>
                <span onclick="switchMode(this, 'POST')">POST</span>
                <span onclick="switchMode(this, 'LIVE')">LIVE</span>
            </div>

            <!-- Bottom Shutter & Gallery -->
            <div class="bottom-bar">
                <div class="gallery-preview" onclick="document.getElementById('file-input').click();">
                    <img id="thumb-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Gallery">
                </div>
                <input type="file" id="file-input" accept="image/*,video/*" onchange="loadMedia(event)">
                
                <!-- Shutter Button / Reel Recorder -->
                <div class="shutter-btn" id="shutter-btn" onclick="handleShutterClick()">
                    <div class="shutter-inner"></div>
                </div>

                <button class="flip-btn" onclick="switchCamera()">🔄</button>
            </div>

        </div>
    </div>

    <!-- Music Modal with Good Songs -->
    <div id="music-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">🎵 Top Trending Songs</div>
            <div class="song-item" onclick="selectSong('Kesariya - Arijit Singh')"><span>🎵 Kesariya</span><span>0:30</span></div>
            <div class="song-item" onclick="selectSong('Millionaire - Yo Yo Honey Singh')"><span>🎵 Millionaire</span><span>0:30</span></div>
            <div class="song-item" onclick="selectSong('Elevated - Shubh')"><span>🎵 Elevated</span><span>0:30</span></div>
            <div class="song-item" onclick="selectSong('Aashiqui Tum Hi Ho')"><span>🎵 Tum Hi Ho</span><span>0:30</span></div>
            <button class="close-modal" onclick="closeModals()">Cancel</button>
        </div>
    </div>

    <!-- Text Modal -->
    <div id="text-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">✏️ Add Text to Reel/Story</div>
            <input type="text" id="story-text-input" placeholder="Type caption or shayari..." style="padding:10px; background:#222; border:1px solid #444; color:#fff; border-radius:8px; font-size:14px;">
            <button class="close-modal" onclick="saveText()" style="background:#dd2a7b;">Done</button>
            <button class="close-modal" onclick="closeModals()">Close</button>
        </div>
    </div>

    <script>
        let currentStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let useFrontCamera = true;
        let currentMode = 'STORY';
        let timerInterval = null;
        let secondsCount = 0;

        async function startCamera() {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }
                const constraints = {
                    video: { facingMode: useFrontCamera ? "user" : "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: true
                };
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('camera-feed').srcObject = currentStream;
                document.getElementById('camera-feed').style.display = 'block';
                document.getElementById('recorded-video').style.display = 'none';
            } catch (err) {
                console.error("Camera error: ", err);
                alert("कृपया कैमरा और माइक की अनुमति (Permission) दें!");
            }
        }

        function switchCamera() {
            if(isRecording) return;
            useFrontCamera = !useFrontCamera;
            startCamera();
        }

        function switchMode(element, mode) {
            document.querySelectorAll('.mode-nav span').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            currentMode = mode;
        }

        // Real Media Recording for Reels & Stories
        function handleShutterClick() {
            if (currentMode === 'REEL' || currentMode === 'STORY') {
                if (!isRecording) {
                    startRecording();
                } else {
                    stopRecording();
                }
            } else {
                capturePhotoSnapshot();
            }
        }

        function startRecording() {
            recordedChunks = [];
            try {
                mediaRecorder = new MediaRecorder(currentStream, { mimeType: 'video/webm;codecs=vp9,opus' });
            } catch (e) {
                try { mediaRecorder = new MediaRecorder(currentStream); } catch(err) { alert("Recording not supported on this browser"); return; }
            }

            mediaRecorder.ondataavailable = function(event) {
                if (event.data.size > 0) recordedChunks.push(event.data);
            };

            mediaRecorder.onstop = function() {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const videoURL = URL.createObjectURL(blob);
                const recordedView = document.getElementById('recorded-video');
                recordedView.src = videoURL;
                recordedView.style.display = 'block';
                document.getElementById('camera-feed').style.display = 'none';
                alert("🎥 " + currentMode + " successfully recorded! Play to preview.");
            };

            mediaRecorder.start();
            isRecording = true;
            document.getElementById('shutter-btn').classList.add('recording');
            
            // Start Timer
            secondsCount = 0;
            document.getElementById('rec-timer').style.display = 'block';
            document.getElementById('rec-timer').innerText = "🔴 REC 00:00";
            timerInterval = setInterval(() => {
                secondsCount++;
                let mins = Math.floor(secondsCount / 60).toString().padStart(2, '0');
                let secs = (secondsCount % 60).toString().padStart(2, '0');
                document.getElementById('rec-timer').innerText = `🔴 REC ${mins}:${secs}`;
            }, 1000);
        }

        function stopRecording() {
            mediaRecorder.stop();
            isRecording = false;
            document.getElementById('shutter-btn').classList.remove('recording');
            clearInterval(timerInterval);
            document.getElementById('rec-timer').style.display = 'none';
        }

        function capturePhotoSnapshot() {
            alert("📸 AI Photo Captured with Ultra HD Quality!");
        }

        function loadMedia(event) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                const preview = document.getElementById('recorded-video');
                preview.src = url;
                preview.style.display = 'block';
                document.getElementById('camera-feed').style.display = 'none';
                document.getElementById('thumb-img').src = url;
                alert("📁 Gallery media loaded successfully!");
            }
        }

        function setFilterEffect(type, name) {
            const videoFeed = document.getElementById('camera-feed');
            document.getElementById('active-filter-name').innerText = name;
            videoFeed.style.filter = 'none';
            if(type === 'portrait') {
                videoFeed.style.filter = 'contrast(1.15) brightness(1.2) saturate(1.25)';
            } else if(type === 'cinematic') {
                videoFeed.style.filter = 'sepia(0.25) contrast(1.25) brightness(0.95)';
            } else if(type === 'cyberpunk') {
                videoFeed.style.filter = 'hue-rotate(75deg) saturate(1.6)';
            }
        }

        function openMusicModal() {
            document.getElementById('music-modal').style.display = 'flex';
        }

        function selectSong(songName) {
            document.getElementById('active-song-btn').innerText = "🎵 " + songName.split(' - ')[0];
            alert("🎵 Song Applied: " + songName + " (Play hoga Reel/Story ke sath)");
            closeModals();
        }

        function openTextModal() {
            document.getElementById('text-modal').style.display = 'flex';
        }

        function saveText() {
            let txt = document.getElementById('story-text-input').value;
            if(txt) {
                alert("✏️ Caption/Text added: '" + txt + "'");
                closeModals();
            }
        }

        function closeModals() {
            document.getElementById('music-modal').style.display = 'none';
            document.getElementById('text-modal').style.display = 'none';
        }

        startCamera();
    </script>
</body>
</html>
