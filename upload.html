<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/style.css"><title>Nexoly11 | Create</title></head><body><header class="topbar"><a class="brand" href="index.html">NEXOLY<span>11</span></a><a href="index.html">✕ Close</a></header><main class="wrap"><section class="panel"><h2 id="uploadTitle">Create Post / Reel</h2><p class="hint">Photo/video choose karein. Video ke liye MP4 ya WEBM recommended. Maximum 50 MB.</p><input class="field" type="file" id="media" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm"><textarea class="field" id="caption" rows="4" maxlength="2200" placeholder="Write a caption… #nexoly11"></textarea><select class="field" id="category"><option>Motivation</option><option>Business</option><option>Bhakti</option><option>Education</option><option>Bollywood</option><option>Rajniti</option><option>Entertainment</option><option>Other</option></select><div id="preview"></div><div class="progress"><i id="progress"></i></div><button class="btn full" id="publish" onclick="N11UI.upload()">Publish to Nexoly11</button><p class="status" id="status">Login required. Upload will save to Supabase Storage and database.</p></section></main><nav class="bottomnav"><a href="index.html">⌂</a><a href="reels.html">▶</a><a href="upload.html">＋</a><a href="messages.html">✉</a><a href="dashboard.html">♙</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/app.js" defer></script><script>if(new URLSearchParams(location.search).get('type')==='story'){document.getElementById('uploadTitle').textContent='Create 24-hour Story';document.getElementById('category').style.display='none'}document.getElementById('media').addEventListener('change',e=>{const f=e.target.files[0],p=document.getElementById('preview');p.innerHTML='';if(!f)return;const u=URL.createObjectURL(f),el=document.createElement(f.type.startsWith('video/')?'video':'img');el.src=u;if(el.tagName==='VIDEO')el.controls=true;el.style='width:100%;max-height:460px;object-fit:contain;margin:12px 0';p.append(el)});</script></body></html>
