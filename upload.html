<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexoly11 Creator Studio Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .phone-frame {
            width: 100%;
            max-width: 410px;
            height: 100vh;
            background: #121212;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        #camera-feed, #preview-media {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        #preview-media {
            display: none;
            z-index: 2;
        }
        .viewfinder-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65%;
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
            z-index: 3;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 10px 20px;
            z-index: 10;
        }
        .logo {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(45deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .top-tools {
            display: flex;
            gap: 15px;
            font-size: 20px;
            cursor: pointer;
        }
        .overlay-content {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%;
            padding: 20px;
        }
        /* Panels */
        .panels-container {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .panel {
            flex: 1;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 10px;
        }
        .panel-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ai-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 6px;
            color: #fff;
            font-size: 10px;
            margin-bottom: 6px;
            resize: none;
            height: 32px;
        }
        .preset-row {
            display: flex;
            gap: 4px;
            overflow-x: auto;
        }
        .preset-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 4px;
            padding: 3px 6px;
            color: #fff;
            font-size: 8px;
            white-space: nowrap;
            cursor: pointer;
        }
        .mode-nav {
            display: flex;
            justify-content: space-around;
            font-size: 11px;
            font-weight: 500;
            color: #888;
            margin-bottom: 12px;
        }
        .mode-nav .active {
            color: #ffffff;
            font-weight: 700;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 2px;
        }
        /* Bottom Bar */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gallery-preview {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.4);
            overflow: hidden;
            background: #333;
            cursor: pointer;
            position: relative;
        }
        .gallery-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .shutter-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
        }
        .shutter-inner {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #fff;
        }
        .flip-btn {
            font-size: 18px;
            background: rgba(255,255,255,0.1);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        /* Hidden file input */
        #file-input {
            display: none;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- Live Camera Feed -->
        <video id="camera-feed" autoplay playsinline></video>
        <!-- Gallery Selected Media Preview -->
        <img id="preview-media" alt="Preview">
        
        <div class="viewfinder-overlay"></div>

        <!-- Top Header with Edit Tools (Text, Music, Filters) -->
        <div class="header">
            <div class="logo">✨ Nexoly11 Pro</div>
            <div class="top-tools">
                <span onclick="addText()" title="Add Text">Aa</span>
                <span onclick="addMusic()" title="Add Music">🎵</span>
                <span onclick="openFilters()" title="Filters">✨</span>
            </div>
        </div>

        <!-- Overlay UI -->
        <div class="overlay-content">
            
            <!-- AI & Normal Pic Options Panel -->
            <div class="panels-container">
                <div class="panel">
                    <div class="panel-title">
                        <span>AI / Normal Mode</span>
                        <input type="checkbox" id="ai-toggle" checked style="accent-color: #3b82f6;">
                    </div>
                    <textarea class="ai-input" id="ai-prompt" placeholder="Prompt for AI Pic (e.g. Cyberpunk)..."></textarea>
                    <div class="preset-row">
                        <button class="preset-btn" onclick="setPreset('Normal HD')">Normal HD</button>
                        <button class="preset-btn" onclick="setPreset('AI Portrait')">AI Portrait</button>
                        <button class="preset-btn" onclick="setPreset('Cinematic')">Cinematic</button>
                    </div>
                </div>
            </div>

            <!-- Mode Selection -->
            <div class="mode-nav">
                <span class="active">STORY</span>
                <span>REEL</span>
                <span>POST</span>
                <span>LIVE</span>
            </div>

            <!-- Bottom Shutter & Gallery -->
            <div class="bottom-bar">
                <!-- Gallery Icon to open phone storage -->
                <div class="gallery-preview" onclick="document.getElementById('file-input').click();">
                    <img id="thumb-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Gallery">
                </div>
                <input type="file" id="file-input" accept="image/*,video/*" onchange="loadMedia(event)">
                
                <!-- Shutter Capture Button -->
                <div class="shutter-btn" onclick="capturePhoto()">
                    <div class="shutter-inner"></div>
                </div>

                <button class="flip-btn" onclick="switchCamera()">🔄</button>
            </div>

        </div>
    </div>

    <script>
        let currentStream = null;
        let useFrontCamera = true;

        async function startCamera() {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }
                const constraints = {
                    video: { facingMode: useFrontCamera ? "user" : "environment" },
                    audio: false
                };
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('camera-feed').srcObject = currentStream;
                document.getElementById('camera-feed').style.display = 'block';
                document.getElementById('preview-media').style.display = 'none';
            } catch (err) {
                console.error("Camera error: ", err);
            }
        }

        function switchCamera() {
            useFrontCamera = !useFrontCamera;
            startCamera();
        }

        // Gallery file picker preview handler
        function loadMedia(event) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                const preview = document.getElementById('preview-media');
                preview.src = url;
                preview.style.display = 'block';
                document.getElementById('camera-feed').style.display = 'none';
                document.getElementById('thumb-img').src = url;
                alert("📁 Media loaded from Gallery! Editing tools ready.");
            }
        }

        function capturePhoto() {
            const isAiOn = document.getElementById('ai-toggle').checked;
            if(isAiOn) {
                alert("✨ AI Pic Generated successfully with high quality!");
            } else {
                alert("📸 Normal HD Photo Captured!");
            }
        }

        function addText() {
            let text = prompt("Enter text for Story/Reel:");
            if(text) alert("✏️ Text added: " + text);
        }

        function addMusic() {
            alert("🎵 Opening Music Library (Select Background Song)...");
        }

        function openFilters() {
            alert("✨ Applying Pro Filters & Editing Tools...");
        }

        function setPreset(val) {
            document.getElementById('ai-prompt').value = val + " style applied";
        }

        // Start camera initially
        startCamera();
    </script>
</body>
</html>
