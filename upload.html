<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexoly11 Creator Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }
        .app-container {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #111;
            overflow: hidden;
        }
        #camera-feed, #media-preview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        #media-preview {
            display: none;
            z-index: 2;
        }
        .viewfinder-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75%;
            background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.3), transparent);
            z-index: 3;
        }
        /* Top Header */
        .header {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }
        .logo {
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .top-tools {
            display: flex;
            gap: 10px;
        }
        .tool-btn {
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(8px);
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }
        /* Overlay UI */
        .overlay-content {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px 15px 25px 15px;
            gap: 10px;
            width: 100%;
        }
        .panels-container {
            display: flex;
            gap: 8px;
        }
        .panel {
            flex: 1;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 10px;
        }
        .panel-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffaa00;
        }
        .preset-row {
            display: flex;
            gap: 5px;
            overflow-x: auto;
        }
        .preset-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            color: #fff;
            font-size: 9px;
            white-space: nowrap;
            cursor: pointer;
        }
        /* Mode Navigation */
        .mode-nav {
            display: flex;
            justify-content: space-around;
            font-size: 12px;
            font-weight: 700;
            color: #888;
            letter-spacing: 1px;
        }
        .mode-nav .active {
            color: #ff5e00;
            border-bottom: 2px solid #ff5e00;
            padding-bottom: 2px;
        }
        /* Bottom Bar */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }
        .gallery-preview {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: 2px solid #fff;
            overflow: hidden;
            background: #222;
            cursor: pointer;
        }
        .gallery-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .shutter-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(221, 42, 123, 0.8);
        }
        .shutter-inner {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #fff;
        }
        .flip-btn {
            font-size: 18px;
            background: rgba(255,255,255,0.2);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        #file-input { display: none; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: #1a1a1a;
            border: 1px solid #333;
            width: 100%;
            max-width: 350px;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .song-item {
            padding: 10px;
            background: #2a2a2a;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Live Camera Feed -->
        <video id="camera-feed" autoplay playsinline muted></video>
        <!-- Media Preview -->
        <video id="media-preview" controls playsinline></video>
        
        <div class="viewfinder-overlay"></div>

        <!-- Top Header -->
        <div class="header">
            <div class="logo">✨ Nexoly11 Studio</div>
            <div class="top-tools">
                <button class="tool-btn" onclick="openMusicModal()" id="song-btn">🎵 Music</button>
                <button class="tool-btn" onclick="openTextPrompt()">✏️ Text</button>
            </div>
        </div>

        <!-- Overlay UI -->
        <div class="overlay-content">
            <div class="panels-container">
                <div class="panel">
                    <div class="panel-title">
                        <span>✨ AI Filters & Quality</span>
                        <span id="filter-name" style="font-size:9px; color:#fff;">HD Active</span>
                    </div>
                    <div class="preset-row">
                        <button class="preset-btn" onclick="applyFilter('normal', 'Normal HD')">Normal</button>
                        <button class="preset-btn" onclick="applyFilter('portrait', 'AI Portrait')">AI Portrait</button>
                        <button class="preset-btn" onclick="applyFilter('cinematic', 'Cinematic 4K')">Cinematic</button>
                        <button class="preset-btn" onclick="applyFilter('cyberpunk', 'Cyberpunk Neon')">Cyberpunk</button>
                    </div>
                </div>
            </div>

            <!-- Mode Selection -->
            <div class="mode-nav">
                <span class="active" onclick="setMode(this, 'STORY')">STORY</span>
                <span onclick="setMode(this, 'REEL')">REEL</span>
                <span onclick="setMode(this, 'POST')">POST</span>
                <span onclick="setMode(this, 'LIVE')">LIVE</span>
            </div>

            <!-- Bottom Bar -->
            <div class="bottom-bar">
                <div class="gallery-preview" onclick="document.getElementById('file-input').click();" title="Open Gallery">
                    <img id="thumb-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Gallery">
                </div>
                <input type="file" id="file-input" accept="image/*,video/*" onchange="previewSelectedFile(event)">
                
                <div class="shutter-btn" onclick="captureAction()">
                    <div class="shutter-inner"></div>
                </div>

                <button class="flip-btn" onclick="switchCamera()">🔄</button>
            </div>
        </div>
    </div>

    <!-- Music Modal -->
    <div id="music-modal" class="modal">
        <div class="modal-content">
            <div style="font-weight:bold; color:#ff5e00;">🎵 Select Background Song</div>
            <div class="song-item" onclick="chooseSong('Kesariya - Arijit Singh')"><span>Kesariya</span><span>0:30</span></div>
            <div class="song-item" onclick="chooseSong('Millionaire - Honey Singh')"><span>Millionaire</span><span>0:30</span></div>
            <div class="song-item" onclick="chooseSong('Elevated - Shubh')"><span>Elevated</span><span>0:30</span></div>
            <button onclick="document.getElementById('music-modal').style.display='none'" style="background:#444; border:none; color:#fff; padding:8px; border-radius:6px;">Close</button>
        </div>
    </div>

    <script>
        let stream = null;
        let useFront = true;
        let currentMode = 'STORY';

        async function initCamera() {
            try {
                if (stream) stream.getTracks().forEach(t => t.stop());
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: useFront ? "user" : "environment" },
                    audio: false
                });
                document.getElementById('camera-feed').srcObject = stream;
                document.getElementById('camera-feed').style.display = 'block';
                document.getElementById('media-preview').style.display = 'none';
            } catch (e) {
                console.log("Camera error:", e);
            }
        }

        function switchCamera() {
            useFront = !useFront;
            initCamera();
        }

        function setMode(el, mode) {
            document.querySelectorAll('.mode-nav span').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
            currentMode = mode;
        }

        function applyFilter(type, name) {
            document.getElementById('filter-name').innerText = name;
            let feed = document.getElementById('camera-feed');
            feed.style.filter = 'none';
            if(type === 'portrait') feed.style.filter = 'contrast(1.15) brightness(1.2) saturate(1.25)';
            else if(type === 'cinematic') feed.style.filter = 'sepia(0.2) contrast(1.2) brightness(0.95)';
            else if(type === 'cyberpunk') feed.style.filter = 'hue-rotate(80deg) saturate(1.5)';
        }

        function previewSelectedFile(event) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                const preview = document.getElementById('media-preview');
                preview.src = url;
                preview.style.display = 'block';
                document.getElementById('camera-feed').style.display = 'none';
                document.getElementById('thumb-img').src = url;
                alert("📁 Media uploaded successfully for " + currentMode + "!");
            }
        }

        function captureAction() {
            alert("✨ " + currentMode + " successfully captured & saved with AI HD Quality!");
        }

        function openMusicModal() {
            document.getElementById('music-modal').style.display = 'flex';
        }

        function chooseSong(song) {
            document.getElementById('song-btn').innerText = "🎵 " + song.split(' - ')[0];
            alert("🎵 Song Applied: " + song);
            document.getElementById('music-modal').style.display = 'none';
        }

        function openTextPrompt() {
            let txt = prompt("Enter text/caption for your " + currentMode + ":");
            if(txt) alert("✏️ Caption added: " + txt);
        }

        initCamera();
    </script>
</body>
</html>
