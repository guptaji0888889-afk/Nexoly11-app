<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexoly11 Camera Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .phone-frame {
            width: 100%;
            max-width: 410px;
            height: 100vh;
            background: #121212;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        /* Live Camera Feed */
        #camera-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        .viewfinder-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            z-index: 2;
        }
        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 20px 15px 20px;
            z-index: 10;
        }
        .logo {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(45deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Controls Overlay */
        .overlay-content {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%;
            padding: 20px;
        }
        /* AI & Quality Panel */
        .panels-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .panel {
            flex: 1;
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 10px;
        }
        .panel-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ai-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 6px;
            color: #fff;
            font-size: 10px;
            margin-bottom: 6px;
            resize: none;
            height: 35px;
        }
        .preset-row {
            display: flex;
            gap: 4px;
            overflow-x: auto;
        }
        .preset-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 4px;
            padding: 3px 6px;
            color: #fff;
            font-size: 8px;
            white-space: nowrap;
        }
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .slider-item {
            font-size: 9px;
            display: flex;
            justify-content: space-between;
            color: #ccc;
        }
        .slider-item input {
            width: 55px;
        }
        /* Mode Selection */
        .mode-nav {
            display: flex;
            justify-content: space-around;
            font-size: 11px;
            font-weight: 500;
            color: #888;
            margin-bottom: 12px;
        }
        .mode-nav .active {
            color: #ffffff;
            font-weight: 700;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 2px;
        }
        /* Shutter Bar */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gallery-preview {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.3);
            overflow: hidden;
            background: #333;
        }
        .gallery-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .shutter-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
        }
        .shutter-inner {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #fff;
        }
        .flip-btn {
            font-size: 18px;
            background: rgba(255,255,255,0.1);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- Live Camera Video Feed -->
        <video id="camera-feed" autoplay playsinline></video>
        <div class="viewfinder-overlay"></div>

        <!-- Top Header -->
        <div class="header">
            <div class="logo">✨ Nexoly11 Camera Pro</div>
            <div style="font-size: 18px; cursor: pointer;">⚙️</div>
        </div>

        <!-- Overlay UI -->
        <div class="overlay-content">
            
            <!-- AI & Pro Controls Panels -->
            <div class="panels-container">
                <!-- AI Panel -->
                <div class="panel">
                    <div class="panel-title">
                        <span>AI Generator</span>
                        <input type="checkbox" checked style="accent-color: #3b82f6;">
                    </div>
                    <textarea class="ai-input" placeholder="Compose with AI..."></textarea>
                    <div class="preset-row">
                        <button class="preset-btn">Portraits</button>
                        <button class="preset-btn">Landscapes</button>
                        <button class="preset-btn">Artistic</button>
                    </div>
                </div>

                <!-- Pro Quality Panel -->
                <div class="panel">
                    <div class="panel-title">Pro Quality</div>
                    <div class="slider-group">
                        <div class="slider-item"><span>4K Res</span> <input type="range" min="1" max="100" value="85"></div>
                        <div class="slider-item"><span>AI Face</span> <input type="range" min="1" max="100" value="70"></div>
                        <div class="slider-item"><span>Depth</span> <input type="range" min="1" max="100" value="60"></div>
                    </div>
                </div>
            </div>

            <!-- Mode Selection -->
            <div class="mode-nav">
                <span class="active">AI PIC</span>
                <span>PRO VIDEO</span>
                <span>CINEMATIC STORY</span>
                <span>RAW PHOTO</span>
            </div>

            <!-- Bottom Shutter & Gallery -->
            <div class="bottom-bar">
                <div class="gallery-preview">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Gallery">
                </div>
                
                <div class="shutter-btn" onclick="capturePhoto()">
                    <div class="shutter-inner"></div>
                </div>

                <button class="flip-btn" onclick="switchCamera()">🔄</button>
            </div>

        </div>
    </div>

    <script>
        let currentStream = null;
        let useFrontCamera = true;

        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            const constraints = {
                video: { facingMode: useFrontCamera ? "user" : "environment" },
                audio: false
            };
            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('camera-feed').srcObject = currentStream;
            } catch (err) {
                console.error("Camera access denied or not available: ", err);
                alert("कृपया कैमरा इस्तेमाल करने की अनुमति (Permission) दें!");
            }
        }

        function switchCamera() {
            useFrontCamera = !useFrontCamera;
            startCamera();
        }

        function capturePhoto() {
            alert("✨ 4K AI Photo Captured Successfully!");
        }

        // Start camera on load
        startCamera();
    </script>
</body>
</html>
