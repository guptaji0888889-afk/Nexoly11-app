<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexoly11 - Ultimate Beauty Camera</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#000;color:#fff;padding:10px}
.top{display:flex;justify-content:space-between;align-items:center;background:#111;padding:10px 14px;border-radius:14px}
.logo{font-weight:900;font-size:22px;background:linear-gradient(90deg,#a855f7,#ec4899,#facc15);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.applied{background:#00e5a0;color:#000;font-size:12px;font-weight:800;padding:5px 10px;border-radius:20px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.badges button{border:none;padding:8px 10px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;background:#222;color:#fff}
.badges button.active{background:#a855f7;color:#fff}
.badges button.gold{background:#f59e0b;color:#000}
.badges button.blue{background:#1e3a8a;color:#fff}
.badges button.green{background:#065f46;color:#fff}
.view{position:relative;border-radius:16px;overflow:hidden;background:#111}
video{width:100%;display:block;aspect-ratio:9/16;object-fit:cover;background:#000}
.overlay{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);padding:5px 10px;border-radius:20px;font-size:12px}
.rain{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,transparent 0 8px,rgba(255,255,255,.25) 8px 9px);opacity:0;display:none}
.fog{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at bottom,rgba(255,255,255,.7),transparent 60%);opacity:0;display:none}
.panel{background:#1a1a1a;padding:12px;border-radius:14px;margin-top:10px}
.panel h3{font-size:14px;margin-bottom:8px;color:#f472b6}
.row{margin-bottom:10px}
.row label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
input[type=range]{width:100%;accent-color:#ec4899}
.checks{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:6px}
.checks label{background:#222;padding:6px 10px;border-radius:20px}
.modes{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.modes button{white-space:nowrap;border:none;padding:10px 14px;border-radius:20px;background:#222;color:#ccc;font-weight:700}
.modes button.active{background:#ec4899;color:#fff}
.shutter{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.thumb{width:52px;height:52px;border-radius:12px;object-fit:cover;border:2px solid #333}
.big{width:72px;height:72px;border-radius:50%;border:4px solid #a855f7;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer}
.flip{width:48px;height:48px;border-radius:50%;background:#222;border:none;color:#fff;font-size:20px}
.btn{width:100%;margin-top:12px;padding:13px;border:none;border-radius:50px;background:#a855f7;color:#fff;font-size:16px;font-weight:800}
.btn2{background:#ec4899}
.status{text-align:center;font-size:12px;color:#aaa;margin-top:8px}
.gallery{display:flex;gap:8px;overflow-x:auto;margin-top:10px}
.gallery img,.gallery video{width:80px;height:100px;object-fit:cover;border-radius:10px}
</style>
</head>
<body>

<div class="top"><div class="logo">NEXOLY11 ✨</div><div class="applied">✓ APPLIED</div></div>

<!-- TOP FEATURE BADGES - 20 SCREENSHOTS WALE -->
<div class="badges">
<button class="gold" onclick="setBg('portrait',this)">Portrait Blur ACTIVE</button>
<button class="gold" onclick="setBg('golden',this)">Golden Hour ACTIVE</button>
<button class="blue" onclick="setBg('night',this)">Night Mode ACTIVE</button>
<button onclick="setBg('rain',this)">Rain Background ON</button>
<button onclick="setBg('sea',this)">Sea Background ON</button>
<button onclick="setBg('fog',this)">Fog Background ON</button>
<button class="green" onclick="setBg('none',this)">Reset / Clear</button>
</div>

<div class="view">
<video id="camera" autoplay playsinline muted></video>
<div class="overlay" id="liveTag">● Live Selfie • 4K • Beauty 70%</div>
<div class="rain" id="rainFx"></div>
<div class="fog" id="fogFx"></div>
</div>

<!-- BEAUTY CAM - Visual Filter Only -->
<div class="panel">
<h3>✨ Beauty Cam - Nexoly11 Pro</h3>
<div class="row"><label>Beauty Smooth Skin <span id="vBeauty">70%</span></label><input type="range" id="beauty" min="0" max="100" value="70"></div>
<div class="row"><label>Bright <span id="vBright">25%</span></label><input type="range" id="bright" min="0" max="100" value="25"></div>
<div class="row"><label>Pink Glow <span id="vGlow">30%</span></label><input type="range" id="glow" min="0" max="100" value="30"></div>
<div class="row"><label>Zoom <span id="vZoom">1x</span></label><input type="range" id="zoom" min="1" max="3" step="0.1" value="1"></div>
<div class="checks">
<label><input type="checkbox" id="is4k" checked> 4K ACTIVE</label>
<label><input type="checkbox" id="isHdr" checked> HDR ACTIVE</label>
<label><input type="checkbox" id="isAi" checked> AI Enhance ON</label>
<label><input type="checkbox" id="isGrid"> Grid</label>
<label><input type="checkbox" id="isFlash"> Flash / Torch</label>
</div>
<button class="btn" onclick="resetBeauty()" style="background:#333;margin-top:8px;padding:10px;font-size:13px">↺ Beauty Reset</button>
</div>

<!-- MODES - ALL 20 SCREENSHOTS -->
<div class="modes" id="modes">
<button class="active" onclick="switchMode('photo',this)">PHOTO</button>
<button onclick="switchMode('video',this)">VIDEO</button>
<button onclick="switchMode('portrait',this)">PORTRAIT</button>
<button onclick="switchMode('reel',this)">REEL VIDEO</button>
<button onclick="switchMode('slowmo',this)">SLOW-MO</button>
<button onclick="switchMode('vlog',this)">VLOG</button>
<button onclick="switchMode('story',this)">STORY 1080p</button>
<button onclick="switchMode('night',this)">NIGHT</button>
</div>

<div class="shutter">
<img id="lastThumb" class="thumb" src="" alt="">
<div class="big" onclick="takePhoto()">📸</div>
<button class="flip" onclick="flipCam()">🔄</button>
</div>

<button class="btn" onclick="takePhoto()">📸 CAPTURE PHOTO - 4K</button>
<button class="btn btn2" onclick="toggleRecord()" id="recBtn">⏺️ START REEL / VIDEO RECORDING</button>
<button class="btn" style="background:#059669" onclick="downloadLast()">⬇️ DOWNLOAD LAST PHOTO</button>

<p class="status" id="status">All Features Applied - Nexoly11 Pro Camera • 4K • HDR • Beauty • Rain • Fog • Sea • Story Fast Upload 85%</p>

<div class="gallery" id="gallery"></div>
<canvas id="canvas" style="display:none"></canvas>

<script>
let stream=null, facing='user', currentMode='photo', recorder=null, chunks=[], recording=false, lastBlob=null, lastUrl='';

async function startCam(){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:3840},height:{ideal:2160}},audio:false});
    document.getElementById('camera').srcObject=stream;
    applyFilter();
    document.getElementById('status').innerText='Camera ON ✓ - '+currentMode.toUpperCase()+' - 4K Ready';
  }catch(e){ document.getElementById('status').innerText='Camera permission allow karo - HTTPS / GitHub Pages pe chalega'; }
}
function applyFilter(){
  const b=+document.getElementById('beauty').value;
  const br=+document.getElementById('bright').value;
  const g=+document.getElementById('glow').value;
  const z=document.getElementById('zoom').value;
  document.getElementById('vBeauty').innerText=b+'%';
  document.getElementById('vBright').innerText=br+'%';
  document.getElementById('vGlow').innerText=g+'%';
  document.getElementById('vZoom').innerText=z+'x';
  const v=document.getElementById('camera');
  // Beauty = Visual Filter Only, No AI Face Retouching
  const bright = 1 + (br/100)*0.6;
  const sat = 1 + (g/100)*0.5;
  const blur = b>80 ? 'blur(0.4px)' : 'blur(0px)';
  v.style.filter=`brightness(${bright}) saturate(${sat}) contrast(1.12) ${blur}`;
  v.style.transform=`scale(${z})`;
}
function setBg(type,btn){
  document.querySelectorAll('.badges button').forEach(x=>x.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const rain=document.getElementById('rainFx'), fog=document.getElementById('fogFx'), v=document.getElementById('camera');
  rain.style.display='none'; fog.style.display='none'; rain.style.opacity=0; fog.style.opacity=0;
  if(type==='rain'){ rain.style.display='block'; rain.style.opacity=1; }
  if(type==='fog'){ fog.style.display='block'; fog.style.opacity=1; }
  if(type==='golden') v.style.filter+=' sepia(0.3)';
  if(type==='night') v.style.filter='brightness(0.9) contrast(1.2)';
  if(type==='sea') v.style.filter='brightness(1.1) saturate(1.5)';
  if(type==='portrait') v.style.filter+=' blur(0.3px)';
  if(type==='none'){ applyFilter(); }
  document.getElementById('status').innerText='Applied ✓ : '+type.toUpperCase()+' - Nexoly11';
}
function switchMode(m,btn){
  currentMode=m;
  document.querySelectorAll('#modes button').forEach(x=>x.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.getElementById('status').innerText='Switched to: '+m.toUpperCase()+' - 4K / HDR Ready - Fast Upload 85%';
  document.getElementById('liveTag').innerText='● '+m.toUpperCase()+' • 4K • Beauty 70%';
}
function resetBeauty(){
  document.getElementById('beauty').value=70;
  document.getElementById('bright').value=25;
  document.getElementById('glow').value=30;
  document.getElementById('zoom').value=1;
  applyFilter();
}
function flipCam(){ facing = facing==='user'?'environment':'user'; startCam(); }
function takePhoto(){
  const v=document.getElementById('camera');
  const c=document.getElementById('canvas');
  if(!v.videoWidth){ alert('Camera pehle ON karo'); return; }
  c.width=v.videoWidth; c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  c.toBlob(b=>{
    lastBlob=b; lastUrl=URL.createObjectURL(b);
    const img=document.createElement('img'); img.src=lastUrl;
    document.getElementById('gallery').prepend(img);
    document.getElementById('lastThumb').src=lastUrl;
    document.getElementById('status').innerText='Saved ✓ 4K Photo - Nexoly11 - Fast Upload 85%';
  },'image/png');
}
function downloadLast(){
  if(!lastUrl){ alert('Pehle photo lo'); return; }
  const a=document.createElement('a'); a.href=lastUrl; a.download='nexoly11-4k.png'; a.click();
}
function toggleRecord(){
  const v=document.getElementById('camera');
  if(!recording){
    chunks=[]; recorder=new MediaRecorder(stream||v.srcObject);
    recorder.ondataavailable=e=>chunks.push(e.data);
    recorder.onstop=()=>{
      const blob=new Blob(chunks,{type:'video/webm'});
      const url=URL.createObjectURL(blob);
      const vid=document.createElement('video'); vid.src=url; vid.controls=true;
      document.getElementById('gallery').prepend(vid);
      document.getElementById('status').innerText='Video Saved ✓ - REEL / VLOG / STORY Ready';
    };
    recorder.start(); recording=true;
    document.getElementById('recBtn').innerText='⏹️ STOP RECORDING';
    document.getElementById('status').innerText='Recording... REEL / VLOG / '+currentMode.toUpperCase();
  }else{
    recorder.stop(); recording=false;
    document.getElementById('recBtn').innerText='⏺️ START REEL / VIDEO RECORDING';
  }
}
['beauty','bright','glow','zoom'].forEach(id=>document.getElementById(id).addEventListener('input',applyFilter));
startCam();
</script>
</body>
</html>
