<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexoly11 Creator Studio Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0b0b;
            color: #ffffff;
            overflow: hidden;
        }
        .app-container {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #121212;
            overflow: hidden;
        }
        #camera-feed, #preview-media {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        #preview-media {
            display: none;
            z-index: 2;
        }
        .viewfinder-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70%;
            background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.3), transparent);
            z-index: 3;
        }
        /* Top Header */
        .header {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }
        .logo {
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(45deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .top-tools {
            display: flex;
            gap: 12px;
            font-size: 18px;
            cursor: pointer;
        }
        .top-tools span {
            background: rgba(255,255,255,0.2);
            padding: 5px 8px;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Main UI Overlay */
        .overlay-content {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px 20px 25px 20px;
            gap: 12px;
            width: 100%;
        }
        /* Panels */
        .panels-container {
            display: flex;
            gap: 8px;
        }
        .panel {
            flex: 1;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 8px 10px;
        }
        .panel-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ai-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            padding: 5px;
            color: #fff;
            font-size: 9px;
            margin-bottom: 4px;
            resize: none;
            height: 28px;
        }
        .preset-row {
            display: flex;
            gap: 4px;
            overflow-x: auto;
        }
        .preset-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 4px;
            padding: 2px 6px;
            color: #fff;
            font-size: 8px;
            white-space: nowrap;
            cursor: pointer;
        }
        /* Mode Navigation */
        .mode-nav {
            display: flex;
            justify-content: space-around;
            font-size: 11px;
            font-weight: 600;
            color: #aaa;
        }
        .mode-nav .active {
            color: #ffffff;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 2px;
        }
        /* Bottom Shutter Bar */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }
        .gallery-preview {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: 2px solid #fff;
            overflow: hidden;
            background: #333;
            cursor: pointer;
        }
        .gallery-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .shutter-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.7);
        }
        .shutter-inner {
            width: 53px;
            height: 53px;
            border-radius: 50%;
            background: #fff;
        }
        .flip-btn {
            font-size: 18px;
            background: rgba(255,255,255,0.15);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        #file-input {
            display: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Live Camera Feed -->
        <video id="camera-feed" autoplay playsinline></video>
        <!-- Gallery Selected Media Preview -->
        <img id="preview-media" alt="Preview">
        
        <div class="viewfinder-overlay"></div>

        <!-- Top Header with Edit Tools -->
        <div class="header">
            <div class="logo">✨ Nexoly11 Pro</div>
            <div class="top-tools">
                <span onclick="addText()" title="Add Text">Aa</span>
                <span onclick="addMusic()" title="Add Music">🎵</span>
                <span onclick="openFilters()" title="Filters">✨</span>
            </div>
        </div>

        <!-- Overlay UI -->
        <div class="overlay-content">
            
            <!-- AI & Normal Pic Options Panel -->
            <div class="panels-container">
                <div class="panel">
                    <div class="panel-title">
                        <span>AI / Normal Mode</span>
                        <input type="checkbox" id="ai-toggle" checked style="accent-color: #3b82f6;">
                    </div>
                    <textarea class="ai-input" id="ai-prompt" placeholder="AI Prompt (e.g. Cinematic)..."></textarea>
                    <div class="preset-row">
                        <button class="preset-btn" onclick="setPreset('Normal HD')">Normal HD</button>
                        <button class="preset-btn" onclick="setPreset('AI Portrait')">AI Portrait</button>
                        <button class="preset-btn" onclick="setPreset('Cyberpunk')">Cyberpunk</button>
                    </div>
                </div>
            </div>

            <!-- Mode Selection -->
            <div class="mode-nav">
                <span class="active" onclick="switchMode(this)">STORY</span>
                <span onclick="switchMode(this)">REEL</span>
                <span onclick="switchMode(this)">POST</span>
                <span onclick="switchMode(this)">LIVE</span>
            </div>

            <!-- Bottom Shutter & Gallery -->
            <div class="bottom-bar">
                <!-- Gallery Icon -->
                <div class="gallery-preview" onclick="document.getElementById('file-input').click();">
                    <img id="thumb-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Gallery">
                </div>
                <input type="file" id="file-input" accept="image/*,video/*" onchange="loadMedia(event)">
                
                <!-- Shutter Button -->
                <div class="shutter-btn" onclick="capturePhoto()">
                    <div class="shutter-inner"></div>
                </div>

                <!-- Flip Camera -->
                <button class="flip-btn" onclick="switchCamera()">🔄</button>
            </div>

        </div>
    </div>

    <script>
        let currentStream = null;
        let useFrontCamera = true;

        async function startCamera() {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }
                const constraints = {
                    video: { facingMode: useFrontCamera ? "user" : "environment" },
                    audio: false
                };
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('camera-feed').srcObject = currentStream;
                document.getElementById('camera-feed').style.display = 'block';
                document.getElementById('preview-media').style.display = 'none';
            } catch (err) {
                console.error("Camera error: ", err);
                alert("Camera permission allow karein!");
            }
        }

        function switchCamera() {
            useFrontCamera = !useFrontCamera;
            startCamera();
        }

        function loadMedia(event) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                const preview = document.getElementById('preview-media');
                preview.src = url;
                preview.style.display = 'block';
                document.getElementById('camera-feed').style.display = 'none';
                document.getElementById('thumb-img').src = url;
                alert("📁 Gallery se media load ho gaya! Ab aap edit kar sakte hain.");
            }
        }

        function capturePhoto() {
            const isAiOn = document.getElementById('ai-toggle').checked;
            if(isAiOn) {
                alert("✨ AI Pic 4K Quality me capture ho gayi!");
            } else {
                alert("📸 Normal HD Photo Captured!");
            }
        }

        function addText() {
            let text = prompt("Story/Reel ke liye text likhein:");
            if(text) alert("✏️ Text added: " + text);
        }

        function addMusic() {
            alert("🎵 Music Library khul rahi hai (Song select karein)...");
        }

        function openFilters() {
            alert("✨ Filters & Editing Tools active ho gaye hain!");
        }

        function setPreset(val) {
            document.getElementById('ai-prompt').value = val + " style selected";
        }

        function switchMode(element) {
            document.querySelectorAll('.mode-nav span').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }

        startCamera();
    </script>
</body>
</html>
