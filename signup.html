<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/style.css"><title>Nexoly11 | Signup</title></head><body><main class="panel auth"><h1>NEXOLY11 🇮🇳</h1><p class="muted">Create your account</p><form id="form"><input class="field" id="name" required maxlength="60" placeholder="Full name"><input class="field" id="username" required maxlength="24" pattern="[A-Za-z0-9_.]+" placeholder="Username"><input class="field" id="email" type="email" required placeholder="Email"><input class="field" id="password" type="password" minlength="8" required placeholder="Password (8+ characters)"><button class="btn full">Create account</button></form><p id="status" class="status"></p><p class="muted">Already registered? <a href="login.html">Login</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/app.js" defer></script><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const name=document.getElementById('name').value.trim(),username=document.getElementById('username').value.trim().toLowerCase(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {data,error}=await N11.auth.signUp({email,password,options:{data:{full_name:name,username},emailRedirectTo:new URL('login.html',location.href).href}});if(error){document.getElementById('status').textContent=error.message;return}if(data.user){const {error:pe}=await N11.from('profiles').upsert({id:data.user.id,username,full_name:name});document.getElementById('status').textContent=pe?'Account created. Profile setup: '+pe.message:'Account created. Email confirmation may be required before login.'}}</script><script src="js/social-extras.js" defer></script><script src="js/theme.js"></script></body></html>
