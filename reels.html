body{background:#000;color:#fff;font-family:system-ui;overflow:hidden}

.cnt{font-size:11px;font-weight:700}
.top{position:fixed;top:0;left:0;right:0;padding:12px;z-index:10;display:flex;justify-content:space-between;background:rgba(0,0,0,0.25)}

.liked{background:#ff2a6d !important}
#comment{position:fixed;bottom:-100%;left:0;right:0;background:#111;padding:15px;border-radius:20px 20px 0 0;z-index:30;transition:0.35s;border-top:1px solid #222}

</head>

<script>
// USERNAME + NEXOLY11 WATERMARK
let uname = "guptaji0888889-afk";
try{uname = localStorage.getItem('username') || uname;}catch(e){}
document.getElementById('wm').innerText = "@"+uname+" • NEXOLY11 ✓";
document.getElementById('userT').innerText = "@"+uname+" ✓";

let liked=false; let cnt=12400;
function like(){
  let b=document.getElementById('likeB'); let c=document.getElementById('likeC');
  if(!liked){b.classList.add('liked'); b.innerText='💖'; cnt++; liked=true; if(navigator.vibrate) navigator.vibrate(50);}

}
function openC(){document.getElementById('comment').classList.add('show')}
function closeC(){document.getElementById('comment').classList.remove('show')}
function postC(){let v=document.getElementById('cIn').value; if(v){alert('Comment Posted: '+v); document.getElementById('cIn').value=''; closeC();}}
function msg(){let m=prompt('Message to @'+uname+':','Hi Boss!'); if(m) alert('✉️ Message Sent: '+m);}
function share(){
  let url=location.href;
  if(navigator.share){navigator.share({title:'NEXOLY11 🇮🇳',text:'Dekho ye Reels Nexoly11 pe!',url:url});}
  else{navigator.clipboard.writeText(url); alert('🔗 Link Copied: '+url);}
}
function down(){
  let wm=document.getElementById('wm').innerText;
  if(confirm('📥 Download with '+wm+' watermark?\nSave to Gallery?')){
    let a=document.createElement('a'); a.download='NEXOLY11_'+uname+'.mp4';

}
